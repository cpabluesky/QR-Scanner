<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>QR 입장 확인</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: Arial, "Noto Sans KR", sans-serif;
      background: #f5f5f5;
      margin: 0;
      padding: 20px;
      text-align: center;
      color: #222;
    }

    .container {
      max-width: 500px;
      margin: 0 auto;
    }

    h2 {
      margin: 10px 0 20px;
    }

    #cameraStartArea {
      background: white;
      padding: 22px;
      border-radius: 12px;
      margin-bottom: 18px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    #reader {
      width: 100%;
      background: white;
      border-radius: 12px;
      overflow: hidden;
    }

    #status {
      margin-top: 18px;
      padding: 16px;
      background: white;
      border-radius: 10px;
      font-size: 17px;
      line-height: 1.6;
    }

    #personCard {
      display: none;
      margin-top: 18px;
      padding: 22px;
      background: white;
      border-radius: 12px;
      text-align: left;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .name {
      font-size: 28px;
      font-weight: bold;
      margin-bottom: 18px;
    }

    .row {
      padding: 10px 0;
      border-bottom: 1px solid #eee;
    }

    .label {
      font-size: 13px;
      color: #777;
      margin-bottom: 3px;
    }

    .value {
      font-size: 17px;
      word-break: break-word;
    }

    .checkin-status {
      margin-top: 18px;
      padding: 16px;
      border-radius: 9px;
      text-align: center;
      line-height: 1.7;
    }

    .not-checked-in {
      background: #fff8e1;
    }

    .already-checked-in {
      background: #fff3cd;
    }

    .completed {
      background: #e8f5e9;
      font-size: 18px;
    }

    .error {
      color: #b00020;
    }

    button {
      width: 100%;
      padding: 15px;
      margin-top: 16px;
      border: none;
      border-radius: 9px;
      font-size: 18px;
      cursor: pointer;
    }

    #cameraStartButton,
    #checkInButton {
      background: #5b3b8c;
      color: white;
      font-weight: bold;
    }

    #scanAgainButton {
      background: #e0e0e0;
      color: #222;
    }

    button:disabled {
      opacity: 0.55;
    }
  </style>
</head>


<body>

<div class="container">

  <h2>QR 입장 확인</h2>

  <div id="cameraStartArea">

    <p>
      QR 코드를 스캔하려면 카메라 사용 권한이 필요합니다.
    </p>

    <button
      id="cameraStartButton"
      onclick="requestCamera()">
      카메라 시작
    </button>

  </div>


  <div id="reader"></div>


  <div id="status">
    위의 「카메라 시작」 버튼을 눌러주세요.
  </div>


  <div id="personCard">

    <div id="personName" class="name"></div>


    <div class="row">
      <div class="label">이메일</div>
      <div id="personEmail" class="value"></div>
    </div>


    <div class="row">
      <div class="label">전화번호</div>
      <div id="personPhone" class="value"></div>
    </div>


    <div class="row">
      <div class="label">성별</div>
      <div id="personGender" class="value"></div>
    </div>


    <div class="row">
      <div class="label">연령대</div>
      <div id="personAge" class="value"></div>
    </div>


    <div id="checkInStatus"></div>


    <button
      id="checkInButton"
      onclick="confirmCheckIn()"
      style="display:none;">
      입장확인
    </button>


    <button
      id="scanAgainButton"
      onclick="restartScanner()">
      다음 사람 스캔
    </button>

  </div>

</div>


<script>

/* =====================================================
   APPS SCRIPT URL
===================================================== */

const API_URL =
  "https://script.google.com/macros/s/AKfycbyrbrkLLohAK3JnfWCk89oJkoK-NaiDAD_Jc323DACOA1YKznW8TaDwo1JVN5DBG7_G/exec";


/* =====================================================
   VARIABLES
===================================================== */

let currentQRCode = "";
let scannerRunning = false;
let processing = false;
let requestCounter = 0;
let cameraPermissionGranted = false;

const html5QrCode =
  new Html5Qrcode("reader");


/* =====================================================
   CAMERA START BUTTON

   여기서는 별도의 getUserMedia()를 호출하지 않습니다.

   html5-qrcode 자체가 카메라 Permission을 요청합니다.
===================================================== */

function requestCamera() {

  const button =
    document.getElementById("cameraStartButton");

  button.disabled = true;

  button.textContent =
    "카메라 연결 중...";


  document.getElementById("status").innerHTML =
    "카메라 사용 권한을 확인하고 있습니다...";


  startScanner();

}


/* =====================================================
   START SCANNER
===================================================== */

function startScanner() {

  processing = false;

  currentQRCode = "";


  document.getElementById(
    "personCard"
  ).style.display = "none";


  document.getElementById(
    "status"
  ).style.display = "block";


  document.getElementById(
    "status"
  ).innerHTML =
    "카메라 사용을 허용해 주세요.";


  const config = {

    fps: 10,

    qrbox: {
      width: 250,
      height: 250
    }

  };


  /*
    중요:

    facingMode를 문자열로만 전달합니다.

    ideal 객체는 전혀 사용하지 않습니다.
  */

  html5QrCode.start(

    {
      facingMode: "environment"
    },

    config,

    onScanSuccess,

    function(errorMessage) {
      // QR을 찾지 못하는 동안의 오류는 무시
    }

  )

  .then(function() {

    scannerRunning = true;

    cameraPermissionGranted = true;


    document.getElementById(
      "cameraStartArea"
    ).style.display =
      "none";


    document.getElementById(
      "status"
    ).innerHTML =
      "QR Code를 카메라에 보여주세요.";

  })

  .catch(function(error) {

    scannerRunning = false;

    cameraPermissionGranted = false;


    const button =
      document.getElementById(
        "cameraStartButton"
      );


    button.disabled = false;

    button.textContent =
      "카메라 시작";


    document.getElementById(
      "cameraStartArea"
    ).style.display =
      "block";


    document.getElementById(
      "status"
    ).innerHTML =

      '<div class="error">' +

      '<strong>카메라를 시작할 수 없습니다.</strong>' +

      '<br><br>' +

      escapeHtml(String(error)) +

      '<br><br>' +

      '브라우저의 카메라 권한을 확인한 후 다시 시도해 주세요.' +

      '</div>';

  });

}


/* =====================================================
   QR DETECTED
===================================================== */

function onScanSuccess(decodedText) {

  if (processing) {
    return;
  }


  processing = true;


  currentQRCode =
    String(decodedText).trim();


  document.getElementById(
    "status"
  ).innerHTML =
    "등록정보를 확인하고 있습니다...";


  html5QrCode.stop()

    .then(function() {

      scannerRunning = false;

      lookupPerson(currentQRCode);

    })

    .catch(function() {

      scannerRunning = false;

      lookupPerson(currentQRCode);

    });

}


/* =====================================================
   LOOKUP
===================================================== */

function lookupPerson(qrCode) {

  callApi(

    "lookup",

    qrCode,

    function(data) {


      if (
        !data ||
        data.success !== true
      ) {

        showError(

          data && data.message
            ? escapeHtml(data.message)
            : "등록정보를 확인할 수 없습니다."

        );

        return;

      }


      if (data.found !== true) {

        showError(

          "등록된 정보를 찾을 수 없습니다." +

          "<br><br>" +

          "QR Code: " +

          escapeHtml(qrCode)

        );

        return;

      }


      displayPerson(data);

    }

  );

}


/* =====================================================
   DISPLAY PERSON
===================================================== */

function displayPerson(person) {

  document.getElementById(
    "status"
  ).style.display =
    "none";


  document.getElementById(
    "personCard"
  ).style.display =
    "block";


  document.getElementById(
    "personName"
  ).textContent =
    person.name || "";


  document.getElementById(
    "personEmail"
  ).textContent =
    person.email || "";


  document.getElementById(
    "personPhone"
  ).textContent =
    person.phone || "";


  document.getElementById(
    "personGender"
  ).textContent =
    person.gender || "";


  document.getElementById(
    "personAge"
  ).textContent =
    person.age || "";


  const status =
    document.getElementById(
      "checkInStatus"
    );


  const button =
    document.getElementById(
      "checkInButton"
    );


  /*
    이미 입장한 경우
  */

  if (person.alreadyCheckedIn === true) {

    status.className =
      "checkin-status already-checked-in";


    status.innerHTML =

      "<strong>이미 입장했습니다.</strong>" +

      "<br>" +

      "입장시각: " +

      escapeHtml(
        person.checkInTime || ""
      );


    button.style.display =
      "none";

  }


  /*
    아직 입장하지 않은 경우
  */

  else {

    status.className =
      "checkin-status not-checked-in";


    status.innerHTML =
      "아직 입장 처리되지 않았습니다.";


    button.style.display =
      "block";


    button.disabled =
      false;


    button.textContent =
      "입장확인";

  }

}


/* =====================================================
   CHECK-IN
===================================================== */

function confirmCheckIn() {

  if (!currentQRCode) {
    return;
  }


  const button =
    document.getElementById(
      "checkInButton"
    );


  button.disabled =
    true;


  button.textContent =
    "입장 처리 중...";


  callApi(

    "checkin",

    currentQRCode,

    function(data) {


      if (
        !data ||
        data.success !== true
      ) {

        button.disabled =
          false;


        button.textContent =
          "입장확인";


        alert(

          data && data.message

            ? data.message

            : "입장 처리 중 오류가 발생했습니다."

        );

        return;

      }


      if (data.found !== true) {

        button.disabled =
          false;


        button.textContent =
          "입장확인";


        alert(
          "등록된 정보를 찾을 수 없습니다."
        );

        return;

      }


      const status =
        document.getElementById(
          "checkInStatus"
        );


      /*
        이미 입장한 경우
      */

      if (data.alreadyCheckedIn === true) {

        status.className =
          "checkin-status already-checked-in";


        status.innerHTML =

          "<strong>이미 입장했습니다.</strong>" +

          "<br>" +

          "입장시각: " +

          escapeHtml(
            data.checkInTime || ""
          );

      }


      /*
        이번에 최초 입장
      */

      else {

        status.className =
          "checkin-status completed";


        status.innerHTML =

          "<strong>✓ 입장 완료</strong>" +

          "<br>" +

          "입장시각: " +

          escapeHtml(
            data.checkInTime || ""
          );

      }


      button.style.display =
        "none";

    }

  );

}


/* =====================================================
   JSONP API
===================================================== */

function callApi(
  action,
  qrCode,
  callback
) {

  requestCounter++;


  const callbackName =

    "jsonpCallback_" +

    requestCounter +

    "_" +

    Date.now();


  const script =
    document.createElement(
      "script"
    );


  let timeout;


  window[callbackName] =
    function(data) {


      clearTimeout(timeout);


      if (script.parentNode) {

        script.parentNode.removeChild(
          script
        );

      }


      delete window[
        callbackName
      ];


      callback(data);

    };


  script.src =

    API_URL +

    "?action=" +

    encodeURIComponent(action) +

    "&code=" +

    encodeURIComponent(qrCode) +

    "&callback=" +

    encodeURIComponent(callbackName) +

    "&t=" +

    Date.now();


  script.onerror =
    function() {


      clearTimeout(timeout);


      if (script.parentNode) {

        script.parentNode.removeChild(
          script
        );

      }


      delete window[
        callbackName
      ];


      showError(
        "등록 데이터베이스에 연결할 수 없습니다."
      );

    };


  timeout =
    setTimeout(

      function() {


        if (script.parentNode) {

          script.parentNode.removeChild(
            script
          );

        }


        delete window[
          callbackName
        ];


        showError(
          "서버 응답 시간이 초과되었습니다."
        );

      },

      15000

    );


  document.body.appendChild(
    script
  );

}


/* =====================================================
   NEXT PERSON
===================================================== */

function restartScanner() {

  if (scannerRunning) {
    return;
  }


  processing =
    false;


  currentQRCode =
    "";


  document.getElementById(
    "personCard"
  ).style.display =
    "none";


  document.getElementById(
    "status"
  ).style.display =
    "block";


  document.getElementById(
    "status"
  ).innerHTML =
    "카메라를 다시 시작하고 있습니다...";


  if (cameraPermissionGranted) {

    startScanner();

  }

  else {

    document.getElementById(
      "cameraStartArea"
    ).style.display =
      "block";


    document.getElementById(
      "status"
    ).innerHTML =
      "위의 「카메라 시작」 버튼을 눌러주세요.";

  }

}


/* =====================================================
   ERROR
===================================================== */

function showError(message) {

  document.getElementById(
    "personCard"
  ).style.display =
    "none";


  const status =
    document.getElementById(
      "status"
    );


  status.style.display =
    "block";


  status.innerHTML =

    '<div class="error">' +

    message +

    '</div>' +

    '<button onclick="restartScanner()">' +

    '다시 스캔' +

    '</button>';

}


/* =====================================================
   HTML ESCAPE
===================================================== */

function escapeHtml(value) {

  const div =
    document.createElement(
      "div"
    );


  div.textContent =
    String(
      value === undefined ||
      value === null
        ? ""
        : value
    );


  return div.innerHTML;

}

</script>

</body>
</html>
