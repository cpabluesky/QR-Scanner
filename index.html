<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>QR 입장 확인</title>

  <!-- QR Scanner Library -->
  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: Arial, "Noto Sans KR", sans-serif;
      background: #f5f5f5;
      margin: 0;
      padding: 20px;
      text-align: center;
      color: #222;
    }

    .container {
      max-width: 500px;
      margin: 0 auto;
    }

    h2 {
      margin: 10px 0 20px;
      color: #333;
    }

    #cameraStartArea {
      background: white;
      padding: 22px;
      border-radius: 12px;
      margin-bottom: 18px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    #cameraStartArea p {
      margin-top: 0;
      line-height: 1.6;
    }

    #reader {
      width: 100%;
      background: white;
      border-radius: 12px;
      overflow: hidden;
    }

    #status {
      margin-top: 18px;
      padding: 16px;
      background: white;
      border-radius: 10px;
      font-size: 17px;
      line-height: 1.6;
    }

    #personCard {
      display: none;
      margin-top: 18px;
      padding: 22px;
      background: white;
      border-radius: 12px;
      text-align: left;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .name {
      font-size: 28px;
      font-weight: bold;
      margin-bottom: 18px;
      color: #333;
    }

    .row {
      padding: 10px 0;
      border-bottom: 1px solid #eee;
    }

    .label {
      font-size: 13px;
      color: #777;
      margin-bottom: 3px;
    }

    .value {
      font-size: 17px;
      color: #222;
      word-break: break-word;
    }

    .checkin-status {
      margin-top: 18px;
      padding: 16px;
      border-radius: 9px;
      text-align: center;
      line-height: 1.7;
    }

    .not-checked-in {
      background: #fff8e1;
    }

    .already-checked-in {
      background: #fff3cd;
    }

    .completed {
      background: #e8f5e9;
      font-size: 18px;
    }

    .error {
      color: #b00020;
    }

    button {
      width: 100%;
      padding: 15px;
      margin-top: 16px;
      border: none;
      border-radius: 9px;
      font-size: 18px;
      cursor: pointer;
    }

    #cameraStartButton,
    #checkInButton {
      background: #5b3b8c;
      color: white;
      font-weight: bold;
    }

    #scanAgainButton {
      background: #e0e0e0;
      color: #222;
    }

    button:disabled {
      opacity: 0.55;
      cursor: default;
    }
  </style>
</head>


<body>

<div class="container">

  <h2>QR 입장 확인</h2>


  <!-- ================================
       CAMERA START
  ================================= -->

  <div id="cameraStartArea">

    <p>
      QR 코드를 스캔하려면 카메라 사용 권한이 필요합니다.
    </p>

    <button
      id="cameraStartButton"
      onclick="requestCamera()">

      카메라 시작

    </button>

  </div>


  <!-- ================================
       QR READER
  ================================= -->

  <div id="reader"></div>


  <!-- ================================
       STATUS
  ================================= -->

  <div id="status">
    위의 「카메라 시작」 버튼을 눌러주세요.
  </div>


  <!-- ================================
       PERSON INFORMATION
  ================================= -->

  <div id="personCard">

    <div id="personName" class="name"></div>


    <div class="row">

      <div class="label">
        이메일
      </div>

      <div id="personEmail" class="value"></div>

    </div>


    <div class="row">

      <div class="label">
        전화번호
      </div>

      <div id="personPhone" class="value"></div>

    </div>


    <div class="row">

      <div class="label">
        성별
      </div>

      <div id="personGender" class="value"></div>

    </div>


    <div class="row">

      <div class="label">
        연령대
      </div>

      <div id="personAge" class="value"></div>

    </div>


    <div id="checkInStatus"></div>


    <button
      id="checkInButton"
      onclick="confirmCheckIn()"
      style="display:none;">

      입장확인

    </button>


    <button
      id="scanAgainButton"
      onclick="restartScanner()">

      다음 사람 스캔

    </button>

  </div>

</div>


<script>

/* =====================================================
   GOOGLE APPS SCRIPT
===================================================== */

const API_URL =
  "https://script.google.com/macros/s/AKfycbyrbrkLLohAK3JnfWCk89oJkoK-NaiDAD_Jc323DACOA1YKznW8TaDwo1JVN5DBG7_G/exec";


/* =====================================================
   VARIABLES
===================================================== */

let currentQRCode = "";

let scannerRunning = false;

let processing = false;

let requestCounter = 0;

let selectedCameraId = null;


const html5QrCode =
  new Html5Qrcode("reader");


/* =====================================================
   1. CAMERA START BUTTON

   카메라 목록을 가져옵니다.

   중요:
   이 코드에는 facingMode를 사용하지 않습니다.
===================================================== */

function requestCamera() {

  const button =
    document.getElementById(
      "cameraStartButton"
    );


  button.disabled = true;

  button.textContent =
    "카메라 연결 중...";


  document.getElementById(
    "status"
  ).innerHTML =
    "카메라 사용 권한을 확인하고 있습니다...";


  /*
    getCameras()가 필요한 경우
    브라우저의 Camera Permission을 요청합니다.
  */

  Html5Qrcode.getCameras()

    .then(function(cameras) {


      if (
        !cameras ||
        cameras.length === 0
      ) {

        throw new Error(
          "사용 가능한 카메라를 찾을 수 없습니다."
        );

      }


      /*
        기본값:

        iPhone에서는 일반적으로
        후면 카메라가 뒤쪽에 나오는 경우가 많으므로
        마지막 카메라를 기본값으로 선택합니다.
      */

      let selectedCamera =
        cameras[cameras.length - 1];


      /*
        Camera label을 확인할 수 있다면
        후면 카메라를 우선적으로 찾습니다.
      */

      for (
        let i = 0;
        i < cameras.length;
        i++
      ) {

        const label =
          String(
            cameras[i].label || ""
          ).toLowerCase();


        if (
          label.includes("back") ||
          label.includes("rear") ||
          label.includes("environment")
        ) {

          selectedCamera =
            cameras[i];

          break;

        }

      }


      /*
        실제 Camera ID 저장
      */

      selectedCameraId =
        selectedCamera.id;


      /*
        카메라 시작
      */

      return startScanner();

    })


    .catch(function(error) {


      selectedCameraId =
        null;


      button.disabled =
        false;


      button.textContent =
        "카메라 시작";


      document.getElementById(
        "cameraStartArea"
      ).style.display =
        "block";


      document.getElementById(
        "status"
      ).innerHTML =

        '<div class="error">' +

        '<strong>카메라를 사용할 수 없습니다.</strong>' +

        '<br><br>' +

        escapeHtml(
          String(error)
        ) +

        '<br><br>' +

        'iPhone 설정에서 Safari의 카메라 사용 권한을 확인한 후 ' +
        '다시 시도해 주세요.' +

        '</div>';

    });

}


/* =====================================================
   2. START SCANNER

   Camera ID를 직접 전달합니다.

   facingMode는 사용하지 않습니다.
===================================================== */

function startScanner() {

  if (!selectedCameraId) {

    return Promise.reject(
      new Error(
        "카메라가 선택되지 않았습니다."
      )
    );

  }


  processing = false;

  currentQRCode = "";


  document.getElementById(
    "personCard"
  ).style.display =
    "none";


  document.getElementById(
    "status"
  ).style.display =
    "block";


  document.getElementById(
    "status"
  ).innerHTML =
    "카메라를 시작하고 있습니다...";


  /*
    QR Scanner 설정

    여기에도 카메라 방향 관련 옵션은
    전혀 사용하지 않습니다.
  */

  const config = {

    fps: 10,

    qrbox: {
      width: 250,
      height: 250
    }

  };


  /*
    selectedCameraId는 단순 문자열입니다.

    예:
    "8C75ECA2..."
  */

  return html5QrCode.start(

    selectedCameraId,

    config,

    onScanSuccess,

    function(errorMessage) {

      /*
        QR Code를 찾는 동안 발생하는
        반복적인 scan error는 무시합니다.
      */

    }

  )

  .then(function() {


    scannerRunning =
      true;


    /*
      카메라가 정상적으로 시작된 후에만
      시작 버튼 영역을 숨깁니다.
    */

    document.getElementById(
      "cameraStartArea"
    ).style.display =
      "none";


    document.getElementById(
      "status"
    ).innerHTML =
      "QR Code를 카메라에 보여주세요.";


  });

}


/* =====================================================
   3. QR CODE DETECTED
===================================================== */

function onScanSuccess(decodedText) {

  /*
    중복 QR 인식 방지
  */

  if (processing) {

    return;

  }


  processing =
    true;


  currentQRCode =
    String(decodedText).trim();


  document.getElementById(
    "status"
  ).innerHTML =

    "QR Code를 인식했습니다." +

    "<br>" +

    "등록정보를 확인하고 있습니다...";


  /*
    QR 인식 후 카메라 중지
  */

  html5QrCode.stop()

    .then(function() {


      scannerRunning =
        false;


      lookupPerson(
        currentQRCode
      );


    })

    .catch(function() {


      scannerRunning =
        false;


      lookupPerson(
        currentQRCode
      );


    });

}


/* =====================================================
   4. LOOKUP PERSON

   action = lookup

   여기서는 Sheet를 수정하지 않습니다.
===================================================== */

function lookupPerson(qrCode) {

  callApi(

    "lookup",

    qrCode,

    function(data) {


      if (
        !data ||
        data.success !== true
      ) {

        showError(

          data &&
          data.message

            ? escapeHtml(
                data.message
              )

            : "등록정보를 확인할 수 없습니다."

        );

        return;

      }


      /*
        QR Code가 등록되어 있지 않은 경우
      */

      if (
        data.found !== true
      ) {

        showError(

          "등록된 정보를 찾을 수 없습니다." +

          "<br><br>" +

          "QR Code: " +

          escapeHtml(qrCode)

        );

        return;

      }


      /*
        등록정보 표시
      */

      displayPerson(data);

    }

  );

}


/* =====================================================
   5. DISPLAY PERSON
===================================================== */

function displayPerson(person) {

  document.getElementById(
    "status"
  ).style.display =
    "none";


  document.getElementById(
    "personCard"
  ).style.display =
    "block";


  /* ---------------------------------------------
     PERSONAL INFORMATION
  --------------------------------------------- */

  document.getElementById(
    "personName"
  ).textContent =
    person.name || "";


  document.getElementById(
    "personEmail"
  ).textContent =
    person.email || "";


  document.getElementById(
    "personPhone"
  ).textContent =
    person.phone || "";


  document.getElementById(
    "personGender"
  ).textContent =
    person.gender || "";


  document.getElementById(
    "personAge"
  ).textContent =
    person.age || "";


  const status =
    document.getElementById(
      "checkInStatus"
    );


  const button =
    document.getElementById(
      "checkInButton"
    );


  /* =================================================
     ALREADY CHECKED IN
  ================================================= */

  if (
    person.alreadyCheckedIn === true
  ) {

    status.className =
      "checkin-status already-checked-in";


    status.innerHTML =

      "<strong>이미 입장했습니다.</strong>" +

      "<br>" +

      "입장시각: " +

      escapeHtml(
        person.checkInTime || ""
      );


    /*
      이미 입장했으므로
      입장확인 버튼을 표시하지 않습니다.
    */

    button.style.display =
      "none";

  }


  /* =================================================
     NOT CHECKED IN
  ================================================= */

  else {

    status.className =
      "checkin-status not-checked-in";


    status.innerHTML =
      "아직 입장 처리되지 않았습니다.";


    button.style.display =
      "block";


    button.disabled =
      false;


    button.textContent =
      "입장확인";

  }

}


/* =====================================================
   6. CHECK-IN

   입장확인 버튼을 눌렀을 때만 실행됩니다.

   Apps Script에서 L열에 입장시각을 기록합니다.
===================================================== */

function confirmCheckIn() {

  if (!currentQRCode) {

    return;

  }


  const button =
    document.getElementById(
      "checkInButton"
    );


  /*
    중복 클릭 방지
  */

  button.disabled =
    true;


  button.textContent =
    "입장 처리 중...";


  callApi(

    "checkin",

    currentQRCode,

    function(data) {


      /* ---------------------------------------------
         SERVER ERROR
      --------------------------------------------- */

      if (
        !data ||
        data.success !== true
      ) {

        button.disabled =
          false;


        button.textContent =
          "입장확인";


        alert(

          data &&
          data.message

            ? data.message

            : "입장 처리 중 오류가 발생했습니다."

        );

        return;

      }


      /* ---------------------------------------------
         QR NOT FOUND
      --------------------------------------------- */

      if (
        data.found !== true
      ) {

        button.disabled =
          false;


        button.textContent =
          "입장확인";


        alert(
          "등록된 정보를 찾을 수 없습니다."
        );


        return;

      }


      const status =
        document.getElementById(
          "checkInStatus"
        );


      /* =============================================
         ALREADY CHECKED IN
      ============================================= */

      if (
        data.alreadyCheckedIn === true
      ) {

        status.className =
          "checkin-status already-checked-in";


        status.innerHTML =

          "<strong>이미 입장했습니다.</strong>" +

          "<br>" +

          "입장시각: " +

          escapeHtml(
            data.checkInTime || ""
          );

      }


      /* =============================================
         NEW CHECK-IN
      ============================================= */

      else {

        status.className =
          "checkin-status completed";


        status.innerHTML =

          "<strong>✓ 입장 완료</strong>" +

          "<br>" +

          "입장시각: " +

          escapeHtml(
            data.checkInTime || ""
          );

      }


      /*
        처리 완료 후
        입장확인 버튼 숨김
      */

      button.style.display =
        "none";

    }

  );

}


/* =====================================================
   7. JSONP API

   GitHub Pages → Google Apps Script
===================================================== */

function callApi(
  action,
  qrCode,
  callback
) {

  requestCounter++;


  const callbackName =

    "jsonpCallback_" +

    requestCounter +

    "_" +

    Date.now();


  const script =
    document.createElement(
      "script"
    );


  let timeout;


  /* ---------------------------------------------
     CALLBACK
  --------------------------------------------- */

  window[callbackName] =
    function(data) {


      clearTimeout(
        timeout
      );


      if (
        script.parentNode
      ) {

        script.parentNode.removeChild(
          script
        );

      }


      delete window[
        callbackName
      ];


      callback(data);

    };


  /* ---------------------------------------------
     REQUEST URL
  --------------------------------------------- */

  script.src =

    API_URL +

    "?action=" +

    encodeURIComponent(
      action
    ) +

    "&code=" +

    encodeURIComponent(
      qrCode
    ) +

    "&callback=" +

    encodeURIComponent(
      callbackName
    ) +

    "&t=" +

    Date.now();


  /* ---------------------------------------------
     NETWORK ERROR
  --------------------------------------------- */

  script.onerror =
    function() {


      clearTimeout(
        timeout
      );


      if (
        script.parentNode
      ) {

        script.parentNode.removeChild(
          script
        );

      }


      delete window[
        callbackName
      ];


      showError(
        "등록 데이터베이스에 연결할 수 없습니다."
      );

    };


  /* ---------------------------------------------
     TIMEOUT
  --------------------------------------------- */

  timeout =
    setTimeout(

      function() {


        if (
          script.parentNode
        ) {

          script.parentNode.removeChild(
            script
          );

        }


        delete window[
          callbackName
        ];


        showError(
          "서버 응답 시간이 초과되었습니다."
        );


      },

      15000

    );


  document.body.appendChild(
    script
  );

}


/* =====================================================
   8. NEXT PERSON
===================================================== */

function restartScanner() {

  if (
    scannerRunning
  ) {

    return;

  }


  processing =
    false;


  currentQRCode =
    "";


  document.getElementById(
    "personCard"
  ).style.display =
    "none";


  document.getElementById(
    "status"
  ).style.display =
    "block";


  document.getElementById(
    "status"
  ).innerHTML =
    "카메라를 다시 시작하고 있습니다...";


  /*
    처음 선택했던 Camera ID가 있으므로
    권한을 다시 요청할 필요 없이
    같은 카메라를 다시 사용합니다.
  */

  if (
    selectedCameraId
  ) {

    startScanner()

      .catch(function(error) {


        document.getElementById(
          "status"
        ).innerHTML =

          '<div class="error">' +

          '카메라를 다시 시작할 수 없습니다.' +

          '<br><br>' +

          escapeHtml(
            String(error)
          ) +

          '</div>';

      });

  }


  /*
    Camera ID가 없다면
    처음부터 다시 시작
  */

  else {

    document.getElementById(
      "cameraStartArea"
    ).style.display =
      "block";


    document.getElementById(
      "status"
    ).innerHTML =
      "위의 「카메라 시작」 버튼을 눌러주세요.";

  }

}


/* =====================================================
   9. ERROR DISPLAY
===================================================== */

function showError(message) {

  document.getElementById(
    "personCard"
  ).style.display =
    "none";


  const status =
    document.getElementById(
      "status"
    );


  status.style.display =
    "block";


  status.innerHTML =

    '<div class="error">' +

    message +

    '</div>' +

    '<button onclick="restartScanner()">' +

    '다시 스캔' +

    '</button>';

}


/* =====================================================
   10. HTML ESCAPE
===================================================== */

function escapeHtml(value) {

  const div =
    document.createElement(
      "div"
    );


  div.textContent =

    String(

      value === undefined ||
      value === null

        ? ""

        : value

    );


  return div.innerHTML;

}

</script>

</body>

</html>
