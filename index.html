<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>입장 확인</title>

  <!-- QR Scanner Library -->
  <script src="https://unpkg.com/html5-qrcode"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./supabase-config.js"></script>
  <script src="./admission-store.js"></script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      font-family: Arial, "Noto Sans KR", sans-serif;
      background: #f5f5f5;
      margin: 0;
      padding: 20px;
      text-align: center;
      color: #222;
    }

    .container {
      max-width: 500px;
      margin: 0 auto;
    }

    h2 {
      margin: 10px 0 20px;
      color: #333;
    }


    /* =================================================
       CAMERA START
    ================================================= */

    #cameraStartArea {
      background: white;
      padding: 22px;
      border-radius: 12px;
      margin-bottom: 18px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    #cameraStartArea p {
      margin-top: 0;
      line-height: 1.6;
    }


    /* =================================================
       QR READER
    ================================================= */

    #reader {
      width: 100%;
      background: white;
      border-radius: 12px;
      overflow: hidden;
    }


    /*
       카메라 실행 중 표시되는
       이름 검색 버튼 영역
    */

    #scannerSearchArea {
      display: none;
      margin-top: 10px;
    }


    /* =================================================
       STATUS
    ================================================= */

    #status {
      margin-top: 18px;
      padding: 16px;
      background: white;
      border-radius: 10px;
      font-size: 17px;
      line-height: 1.6;
    }


    /* =================================================
       NAME SEARCH
    ================================================= */

    #nameSearchArea {
      display: none;
      background: white;
      padding: 22px;
      border-radius: 12px;
      margin-bottom: 18px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    #nameSearchArea p {
      margin-top: 0;
      line-height: 1.6;
    }

    #nameInput {
      width: 100%;
      padding: 15px;
      border: 1px solid #ccc;
      border-radius: 9px;
      font-size: 18px;
      outline: none;
    }

    #nameInput:focus {
      border-color: #5b3b8c;
    }

    #searchResults {
      margin-top: 18px;
      text-align: left;
    }

    .search-result {
      background: white;
      border: 1px solid #ddd;
      border-radius: 10px;
      padding: 15px;
      margin-bottom: 10px;
      cursor: pointer;
    }

    .search-result:hover {
      background: #f6f2fb;
      border-color: #5b3b8c;
    }

    .search-result-name {
      font-size: 20px;
      font-weight: bold;
      color: #333;
      margin-bottom: 6px;
    }

    .search-result-detail {
      font-size: 14px;
      color: #666;
      line-height: 1.5;
    }

    .search-result-status {
      margin-top: 7px;
      font-size: 14px;
    }

    .search-checked-in {
      color: #8a6d00;
    }

    .search-not-checked-in {
      color: #2e7d32;
    }


    /* =================================================
       PERSON CARD
    ================================================= */

    #personCard {
      display: none;
      margin-top: 18px;
      padding: 22px;
      background: white;
      border-radius: 12px;
      text-align: left;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .name {
      font-size: 28px;
      font-weight: bold;
      margin-bottom: 18px;
      color: #333;
    }

    .row {
      padding: 10px 0;
      border-bottom: 1px solid #eee;
    }

    .label {
      font-size: 13px;
      color: #777;
      margin-bottom: 3px;
    }

    .value {
      font-size: 17px;
      color: #222;
      word-break: break-word;
    }


    /* =================================================
       CHECK-IN STATUS
    ================================================= */

    .checkin-status {
      margin-top: 18px;
      padding: 16px;
      border-radius: 9px;
      text-align: center;
      line-height: 1.7;
    }

    .not-checked-in {
      background: #fff8e1;
    }

    .already-checked-in {
      background: #fff3cd;
    }

    .completed {
      background: #e8f5e9;
      font-size: 18px;
    }

    .error {
      color: #b00020;
    }


    /* =================================================
       BUTTONS
    ================================================= */

    button {
      width: 100%;
      padding: 15px;
      margin-top: 16px;
      border: none;
      border-radius: 9px;
      font-size: 18px;
      cursor: pointer;
    }

    #cameraStartButton,
    #checkInButton,
    #searchButton {
      background: #5b3b8c;
      color: white;
      font-weight: bold;
    }

    #nameSearchButton,
    #scannerNameSearchButton {
      background: white;
      color: #5b3b8c;
      border: 2px solid #5b3b8c;
      font-weight: bold;
    }

    #scannerNameSearchButton {
      margin-top: 0;
    }

    #scanAgainButton,
    #backToScannerButton {
      background: #e0e0e0;
      color: #222;
    }

    button:disabled {
      opacity: 0.55;
      cursor: default;
    }

    .topbar { position:relative; display:flex; align-items:center; justify-content:center; min-height:62px; margin-bottom:12px; }
    .topbar h2 { margin:10px 0; }
    #admissionStatsToggle { position:absolute; right:0; top:50%; transform:translateY(-50%); width:auto; margin:0; padding:8px 10px; border:0; background:transparent; color:#5b3b8c; font-size:14px; font-weight:600; }
    #admissionStatsToggle:hover, #admissionStatsToggle:focus-visible { text-decoration:underline; }
    #admissionStatistics[hidden] { display:none !important; }
    #admissionStatistics { background:white; padding:18px; border-radius:10px; margin-bottom:15px; text-align:left; }
    #admissionStatistics h3 { margin:0 0 12px; }
    #admissionStatsCount { font-size:24px; font-weight:bold; margin:8px 0; }
    #admissionProgress { width:100%; height:20px; accent-color:#5b3b8c; }
    #admissionStatsMessage { font-size:13px; margin-bottom:0; }
    #databaseMessage { font-size:14px; white-space:pre-wrap; }
  </style>

</head>


<body>

<div class="container">

  <div class="topbar"><h2>입장 확인</h2><button id="admissionStatsToggle" type="button" aria-expanded="false" aria-controls="admissionStatistics" onclick="toggleAdmissionStatistics()">입장현황</button></div>
  <p id="databaseMessage" role="status">입장 DB 연결 설정을 확인하고 있습니다.</p>
  <section id="admissionStatistics" hidden aria-labelledby="admissionStatsHeading">
    <h3 id="admissionStatsHeading">입장현황</h3>
    <div aria-live="polite" aria-atomic="true">
      <p id="admissionStatsCount">입장현황을 확인하고 있습니다.</p>
      <p id="admissionStatsPercentage"></p>
    </div>
    <progress id="admissionProgress" max="100" value="0" aria-label="등록자 대비 입장률"></progress>
    <p id="admissionStatsMessage" role="status"></p>
  </section>


  <!-- =================================================
       INITIAL SCREEN
  ================================================= -->

  <div id="cameraStartArea">

    <p>
      QR 코드를 스캔하거나 이름, 전화번호, 이메일로 등록자를 찾을 수 있습니다.
    </p>

    <button
      id="cameraStartButton"
      onclick="requestCamera()">
      QR 코드 스캔
    </button>

    <button
      id="nameSearchButton"
      onclick="openNameSearch()">
      이름, 전화번호, 이메일로 찾기
    </button>

  </div>


  <!-- =================================================
       QR READER
  ================================================= -->

  <div id="reader"></div>


  <!-- =================================================
       NAME SEARCH BUTTON DURING SCANNING
  ================================================= -->

  <div id="scannerSearchArea">

    <button
      id="scannerNameSearchButton"
      onclick="openNameSearch()">
      이름, 전화번호, 이메일로 찾기
    </button>

  </div>


  <!-- =================================================
       NAME SEARCH
  ================================================= -->

  <div id="nameSearchArea">

    <p>
      이름, 전화번호, 이메일의 일부를 입력해 주세요
    </p>

    <input
      type="text"
      id="nameInput"
      placeholder="예: 승현, 0401, @gmail.com"
      autocomplete="off"
      onkeydown="handleSearchKey(event)"
    >

    <button
      id="searchButton"
      onclick="searchByName()">
      검색
    </button>

    <div id="searchResults"></div>

    <button
      id="backToScannerButton"
      onclick="backToScanner()">
      QR 스캔으로 돌아가기
    </button>

  </div>


  <!-- =================================================
       STATUS
  ================================================= -->

  <div id="status">
    QR 코드 스캔 또는 이름, 전화번호, 이메일로 찾기를 선택해 주세요.
  </div>


  <!-- =================================================
       PERSON INFORMATION
  ================================================= -->

  <div id="personCard">

    <div
      id="personName"
      class="name">
    </div>


    <div class="row">

      <div class="label">
        이메일
      </div>

      <div
        id="personEmail"
        class="value">
      </div>

    </div>


    <div class="row">

      <div class="label">
        전화번호
      </div>

      <div
        id="personPhone"
        class="value">
      </div>

    </div>


    <div class="row">

      <div class="label">
        성별
      </div>

      <div
        id="personGender"
        class="value">
      </div>

    </div>


    <div class="row">

      <div class="label">
        연령대
      </div>

      <div
        id="personAge"
        class="value">
      </div>

    </div>


    <div id="checkInStatus"></div>


    <button
      id="checkInButton"
      onclick="confirmCheckIn()"
      style="display:none;">
      입장확인
    </button>


    <button
      id="scanAgainButton"
      onclick="nextPerson()">
      다음 사람
    </button>

  </div>

</div>


<script>

/* =====================================================
   VARIABLES
===================================================== */

let currentQRCode = "";

let scannerRunning = false;

let processing = false;


let selectedCameraId = null;

let currentMode = "scan";


const html5QrCode =
  new Html5Qrcode("reader");


/* =====================================================
   1. CAMERA START
===================================================== */

function requestCamera() {

  if (!admissionsConfigured) return alert('입장 DB 연결 설정을 확인해 주세요.');
  admissionViewVersion++;

  currentMode = "scan";


  document.getElementById(
    "nameSearchArea"
  ).style.display =
    "none";


  const button =
    document.getElementById(
      "cameraStartButton"
    );


  button.disabled =
    true;


  button.textContent =
    "카메라 연결 중...";


  document.getElementById(
    "status"
  ).innerHTML =
    "카메라 사용 권한을 확인하고 있습니다...";


  Html5Qrcode.getCameras()

    .then(function(cameras) {


      if (
        !cameras ||
        cameras.length === 0
      ) {

        throw new Error(
          "사용 가능한 카메라를 찾을 수 없습니다."
        );

      }


      /*
         기본적으로 마지막 카메라 선택
      */

      let selectedCamera =
        cameras[cameras.length - 1];


      /*
         후면 카메라 우선 검색
      */

      for (
        let i = 0;
        i < cameras.length;
        i++
      ) {

        const label =
          String(
            cameras[i].label || ""
          ).toLowerCase();


        if (
          label.includes("back") ||
          label.includes("rear") ||
          label.includes("environment")
        ) {

          selectedCamera =
            cameras[i];

          break;

        }

      }


      selectedCameraId =
        selectedCamera.id;


      return startScanner();

    })


    .catch(function(error) {


      selectedCameraId =
        null;


      button.disabled =
        false;


      button.textContent =
        "QR 코드 스캔";


      document.getElementById(
        "cameraStartArea"
      ).style.display =
        "block";


      document.getElementById(
        "scannerSearchArea"
      ).style.display =
        "none";


      document.getElementById(
        "status"
      ).innerHTML =

        '<div class="error">' +

        '<strong>카메라를 사용할 수 없습니다.</strong>' +

        '<br><br>' +

        escapeHtml(
          String(error)
        ) +

        '</div>';

    });

}


/* =====================================================
   2. START SCANNER
===================================================== */

function startScanner() {

  if (!admissionsConfigured) return Promise.reject(new Error('입장 DB 연결 설정을 확인해 주세요.'));

  if (!selectedCameraId) {

    return Promise.reject(

      new Error(
        "카메라가 선택되지 않았습니다."
      )

    );

  }


  currentMode =
    "scan";


  processing =
    false;


  currentQRCode =
    "";


  document.getElementById(
    "nameSearchArea"
  ).style.display =
    "none";


  document.getElementById(
    "personCard"
  ).style.display =
    "none";


  document.getElementById(
    "status"
  ).style.display =
    "block";


  document.getElementById(
    "status"
  ).innerHTML =
    "카메라를 시작하고 있습니다...";


  const config = {

    fps: 10,

    qrbox: {

      width: 250,

      height: 250

    }

  };


  return html5QrCode.start(

    selectedCameraId,

    config,

    onScanSuccess,

    function(errorMessage) {

      /*
         반복적인 QR scan error는 무시
      */

    }

  )

  .then(function() {


    scannerRunning =
      true;


    /*
       초기 화면 숨김
    */

    document.getElementById(
      "cameraStartArea"
    ).style.display =
      "none";


    /*
       카메라 아래 이름 검색 버튼 표시
    */

    document.getElementById(
      "scannerSearchArea"
    ).style.display =
      "block";


    document.getElementById(
      "status"
    ).innerHTML =
      "QR Code를 카메라에 보여주세요.";

  });

}


/* =====================================================
   3. QR CODE DETECTED
===================================================== */

function onScanSuccess(decodedText) {

  if (!admissionsConfigured) return;

  if (processing) {

    return;

  }


  processing =
    true;


  currentQRCode =
    String(
      decodedText
    ).trim();


  /*
     QR 인식 후 이름검색 버튼 숨김
  */

  document.getElementById(
    "scannerSearchArea"
  ).style.display =
    "none";


  document.getElementById(
    "status"
  ).innerHTML =

    "QR Code를 인식했습니다." +

    "<br>" +

    "등록정보를 확인하고 있습니다...";


  html5QrCode.stop()

    .then(function() {


      scannerRunning =
        false;


      lookupPerson(
        currentQRCode
      );

    })


    .catch(function() {


      scannerRunning =
        false;


      lookupPerson(
        currentQRCode
      );

    });

}


/* =====================================================
   4. LOOKUP PERSON
===================================================== */

function lookupPerson(qrCode) {
  const version = ++admissionViewVersion;

  localLookup(qrCode, function(data) {
      if (version !== admissionViewVersion) return;


      if (
        !data ||
        data.success !== true
      ) {

        showError(

          data &&
          data.message

            ? escapeHtml(
                data.message
              )

            : "등록정보를 확인할 수 없습니다."

        );

        return;

      }


      if (
        data.found !== true
      ) {

        showError(

          "등록된 정보를 찾을 수 없습니다." +

          "<br><br>" +

          "QR Code: " +

          escapeHtml(
            qrCode
          )

        );

        return;

      }


      displayPerson(
        data
      );

    }

  );

}


/* =====================================================
   5. OPEN NAME SEARCH

   초기 화면 또는
   카메라 스캔 화면에서 호출 가능
===================================================== */

function openNameSearch() {

  if (!admissionsConfigured) return alert('입장 DB 연결 설정을 확인해 주세요.');
  admissionViewVersion++;
  visibleSearchResults = [];

  currentMode =
    "search";


  currentQRCode =
    "";


  processing =
    false;


  /*
     스캔 화면의 이름 검색 버튼 숨김
  */

  document.getElementById(
    "scannerSearchArea"
  ).style.display =
    "none";


  /*
     카메라 실행 중이면 먼저 중지
  */

  if (scannerRunning) {

    html5QrCode.stop()

      .then(function() {

        scannerRunning =
          false;

      })

      .catch(function() {

        scannerRunning =
          false;

      });

  }


  document.getElementById(
    "cameraStartArea"
  ).style.display =
    "none";


  document.getElementById(
    "personCard"
  ).style.display =
    "none";


  document.getElementById(
    "status"
  ).style.display =
    "none";


  document.getElementById(
    "nameSearchArea"
  ).style.display =
    "block";


  document.getElementById(
    "searchResults"
  ).innerHTML =
    "";


  const input =
    document.getElementById(
      "nameInput"
    );


  input.value =
    "";


  setTimeout(

    function() {

      input.focus();

    },

    100

  );

}


/* =====================================================
   6. ENTER KEY SEARCH
===================================================== */

function handleSearchKey(event) {

  if (
    event.key === "Enter"
  ) {

    event.preventDefault();

    searchByName();

  }

}


/* =====================================================
   7. SEARCH BY NAME
===================================================== */

function searchByName() {
  const version = ++admissionViewVersion;
  visibleSearchResults = [];

  const input =
    document.getElementById(
      "nameInput"
    );


  const keyword =
    String(
      input.value || ""
    ).trim();


  const resultsArea =
    document.getElementById(
      "searchResults"
    );


  if (!keyword) {

    resultsArea.innerHTML =

      '<div class="error">' +

      '검색할 이름, 전화번호 또는 이메일을 입력해 주세요.' +

      '</div>';

    return;

  }


  const button =
    document.getElementById(
      "searchButton"
    );


  button.disabled =
    true;


  button.textContent =
    "검색 중...";


  resultsArea.innerHTML =
    "검색하고 있습니다...";


  localSearch(keyword, function(data) {
      if (version !== admissionViewVersion) return;


      button.disabled =
        false;


      button.textContent =
        "검색";


      if (
        !data ||
        data.success !== true
      ) {

        resultsArea.innerHTML =

          '<div class="error">' +

          escapeHtml(

            data &&
            data.message

              ? data.message

              : "검색 중 오류가 발생했습니다."

          ) +

          '</div>';

        return;

      }


      if (
        data.found !== true ||
        !Array.isArray(
          data.results
        ) ||
        data.results.length === 0
      ) {

        resultsArea.innerHTML =

          '<div class="error">' +

          '일치하는 등록자를 찾을 수 없습니다.' +

          '</div>';

        return;

      }


      displaySearchResults(
        data.results
      );

    }

  );

}


/* =====================================================
   8. DISPLAY SEARCH RESULTS
===================================================== */

function displaySearchResults(results) {
  visibleSearchResults = results;

  const resultsArea =
    document.getElementById(
      "searchResults"
    );


  resultsArea.innerHTML =
    "";


  const summary =
    document.createElement(
      "div"
    );


  summary.style.marginBottom =
    "12px";


  summary.textContent =

    results.length +

    "명의 검색 결과가 있습니다.";


  resultsArea.appendChild(
    summary
  );


  results.forEach(

    function(person) {


      const item =
        document.createElement(
          "div"
        );


      item.className =
        "search-result";


      const name =
        document.createElement(
          "div"
        );


      name.className =
        "search-result-name";


      name.textContent =
        person.name || "";


      const detail =
        document.createElement(
          "div"
        );


      detail.className =
        "search-result-detail";


      detail.textContent =

        [

          person.email || "",

          person.phone || "",

          person.gender || "",

          person.age || ""

        ]

        .filter(Boolean)

        .join(" · ");


      const checkStatus =
        document.createElement(
          "div"
        );


      checkStatus.className =

        "search-result-status " +

        (
          person.alreadyCheckedIn

            ? "search-checked-in"

            : "search-not-checked-in"
        );


      if (
        person.alreadyCheckedIn
      ) {

        checkStatus.textContent =

          "이미 입장 · " +

          (
            person.checkInTime || ""
          );

      }

      else {

        checkStatus.textContent =
          "미입장";

      }


      item.appendChild(
        name
      );


      item.appendChild(
        detail
      );


      item.appendChild(
        checkStatus
      );


      item.onclick =
        function() {

          selectSearchResult(
            person
          );

        };


      resultsArea.appendChild(
        item
      );

    }

  );

}


/* =====================================================
   9. SELECT SEARCH RESULT
===================================================== */

function selectSearchResult(person) {

  if (
    !person ||
    !person.code
  ) {

    alert(
      "이 등록정보에는 QR Code가 없습니다."
    );

    return;

  }


  currentQRCode =
    String(
      person.code
    ).trim();


  currentMode =
    "search";


  document.getElementById(
    "nameSearchArea"
  ).style.display =
    "none";


  // A different device may have admitted this person since the search completed.
  lookupPerson(currentQRCode);

}


/* =====================================================
   10. DISPLAY PERSON
===================================================== */

function displayPerson(person) {

  document.getElementById(
    "scannerSearchArea"
  ).style.display =
    "none";


  document.getElementById(
    "status"
  ).style.display =
    "none";


  document.getElementById(
    "personCard"
  ).style.display =
    "block";


  document.getElementById(
    "personName"
  ).textContent =
    person.name || "";


  document.getElementById(
    "personEmail"
  ).textContent =
    person.email || "";


  document.getElementById(
    "personPhone"
  ).textContent =
    person.phone || "";


  document.getElementById(
    "personGender"
  ).textContent =
    person.gender || "";


  document.getElementById(
    "personAge"
  ).textContent =
    person.age || "";


  const status =
    document.getElementById(
      "checkInStatus"
    );


  const button =
    document.getElementById(
      "checkInButton"
    );


  /*
     이미 입장
  */

  if (
    person.alreadyCheckedIn === true
  ) {

    status.className =
      "checkin-status already-checked-in";


    status.innerHTML =

      "<strong>이미 입장했습니다.</strong>" +

      "<br>" +

      "입장시각: " +

      escapeHtml(
        person.checkInTime || ""
      );


    button.style.display =
      "none";

  }


  /*
     미입장
  */

  else {

    status.className =
      "checkin-status not-checked-in";


    status.innerHTML =
      "아직 입장 처리되지 않았습니다.";


    button.style.display =
      "block";


    button.disabled =
      false;


    button.textContent =
      "입장확인";

  }

}


/* =====================================================
   11. CHECK-IN
===================================================== */

function confirmCheckIn() {

  if (!currentQRCode || checkInPending) {

    return;

  }

  const version = ++admissionViewVersion;
  checkInPending = true;

  const button =
    document.getElementById(
      "checkInButton"
    );


  button.disabled =
    true;


  button.textContent =
    "입장 처리 중...";


  localCheckIn(currentQRCode, function(data) {
      checkInPending = false;
      if (version !== admissionViewVersion) return;


      if (
        !data ||
        data.success !== true
      ) {

        button.disabled =
          false;


        button.textContent =
          "입장확인";


        alert(

          data &&
          data.message

            ? data.message

            : "입장 처리 중 오류가 발생했습니다."

        );

        return;

      }


      if (
        data.found !== true
      ) {

        button.disabled =
          false;


        button.textContent =
          "입장확인";


        alert(
          "등록된 정보를 찾을 수 없습니다."
        );

        return;

      }


      const status =
        document.getElementById(
          "checkInStatus"
        );


      if (
        data.alreadyCheckedIn === true
      ) {

        status.className =
          "checkin-status already-checked-in";


        status.innerHTML =

          "<strong>이미 입장했습니다.</strong>" +

          "<br>" +

          "입장시각: " +

          escapeHtml(
            data.checkInTime || ""
          );

      }

      else {

        status.className =
          "checkin-status completed";


        status.innerHTML =

          "<strong>✓ 입장 완료</strong>" +

          "<br>" +

          "입장시각: " +

          escapeHtml(
            data.checkInTime || ""
          );

      }


      button.style.display =
        "none";

    }

  );

}

===================================================== */

function escapeHtml(value) {

  const div =
    document.createElement(
      "div"
    );


  div.textContent =

    String(

      value === undefined ||
      value === null

        ? ""

        : value

    );


  return div.innerHTML;

}


function toggleAdmissionStatistics() {
  const panel = document.getElementById('admissionStatistics');

/* Registration lookups use a CSV in the same GitHub Pages directory. */
const REGISTRATION_FILE = './registrations.csv';
let registrationList = [];
let registrationLoaded = false;
const registrationByCode = new Map();

// RFC 4180-style CSV: handles quoted fields, commas, escaped quotes and newlines.
function parseCSV(text) {
  text = text.replace(/^\uFEFF/, '');
  const rows = [];
  let row = [], field = '', quoted = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (quoted) {
      if (ch === '"' && text[i + 1] === '"') { field += '"'; i++; }
      else if (ch === '"') quoted = false;
      else field += ch;
    } else if (ch === '"' && field === '') quoted = true;
    else if (ch === ',') { row.push(field); field = ''; }
    else if (ch === '\n' || ch === '\r') {
      if (ch === '\r' && text[i + 1] === '\n') i++;
      row.push(field); field = '';
      if (row.some(x => x.trim() !== '')) rows.push(row);
      row = [];
    } else field += ch;
  }
  if (quoted) throw new Error('CSV 따옴표가 닫히지 않았습니다.');
  row.push(field);
  if (row.some(x => x.trim() !== '')) rows.push(row);
  return rows;
}

async function loadRegistrations() {
  // Preserve a working list if a later refresh temporarily fails.
  try {
    const response = await fetch(REGISTRATION_FILE + '?v=' + Date.now(), {cache:'no-store'});
    if (!response.ok) throw new Error('HTTP ' + response.status);
    const rows = parseCSV(await response.text());
    if (rows.length < 2) throw new Error('CSV에 헤더와 등록자 데이터가 필요합니다.');
    // Keep the original Google Forms headers and read by fixed column position.
    // A timestamp, B name, C email, D phone, E gender, F age.
    // Find the QR code column by header so registration IDs are not used as codes.
    const qrCodeColumn = rows[0].findIndex(header =>
      header.trim().toLowerCase().replace(/[\s_]/g, '') === 'qrcodes'
    );
    if (qrCodeColumn === -1) throw new Error('CSV에 Qr_Codes 열이 없습니다.');
    const next = [], nextMap = new Map();
    for (let i = 1; i < rows.length; i++) {
      const r = rows[i];
      const name = String(r[1] ?? '').trim();
      if (!name) continue;
      const p = {
        code: String(r[qrCodeColumn] ?? '').trim(),
        name,
        email: String(r[2] ?? '').trim(),
        phone: String(r[3] ?? '').trim(),
        gender: String(r[4] ?? '').trim(),
        age: String(r[5] ?? '').trim()
      };
      if (!p.code) throw new Error(`CSV ${i + 1}행의 Qr_Codes 열에 QR 코드가 없습니다.`);
      const key = p.code;
      if (nextMap.has(key)) throw new Error(`CSV에 중복 QR 코드가 있습니다: ${p.code}`);
      nextMap.set(key, p);
      next.push(p);
    }
    if (!next.length) throw new Error('CSV에 유효한 등록자가 없습니다.');
    registrationList = next;
    registrationByCode.clear();
    nextMap.forEach((p, key) => registrationByCode.set(key, p));
    registrationLoaded = true;
    return true;
  } catch (error) {
    document.getElementById('status').textContent = 'CSV 명단을 읽을 수 없습니다: ' + error.message;
    return false;
  }
}
function formatAdmissionTime(value) {
  if (!value) return '';
  const date = new Date(value);
  if (Number.isNaN(date.getTime())) throw new Error('입장시간을 확인할 수 없습니다.');
  return date.toLocaleString('ko-KR', {timeZone:'Australia/Sydney', timeZoneName:'short'});
}
function combinedPerson(person, state) {
  return {...person, alreadyCheckedIn:state.status === 'checked_in',
    checkInTime:formatAdmissionTime(state.checked_in_at)};
}
async function admissionRequest(work, callback) {
  let result;
  try {
    if (!admissionStore || !admissionsConfigured) throw new Error('입장 DB 연결 설정을 확인해 주세요.');
    result = await work();
  } catch (error) {
    result = {success:false, message:error.message || '입장 DB 연결에 실패했습니다. 다시 시도해 주세요.'};
  }
  callback(result);
}
function localLookup(code, callback) {
  admissionRequest(async () => {
    if (!registrationLoaded) throw new Error('등록자 CSV 명단을 불러오지 못했습니다.');
    const p = registrationByCode.get(String(code).trim());
    if (!p) return {success:true,found:false};
    const states = await admissionStore.getStates([p.code]);
    return {success:true,found:true,...combinedPerson(p, states.get(p.code))};
  }, callback);
}
function matchesRegistration(person, keyword) {
  const query = keyword.trim().toLocaleLowerCase();
  if (!query) return false;
  if ([person.name, person.phone, person.email].some(value =>
    String(value || '').toLocaleLowerCase().includes(query))) return true;
  // A phone fragment also matches across spaces, parentheses and hyphens.
  const digits = query.replace(/\D/g, '');
  return digits.length > 0 && /^[+\d\s().-]+$/.test(query) &&
    String(person.phone || '').replace(/\D/g, '').includes(digits);
}
function localSearch(keyword, callback) {
  admissionRequest(async () => {
    if (!registrationLoaded) throw new Error('등록자 CSV 명단을 불러오지 못했습니다.');
    const people = registrationList.filter(p => matchesRegistration(p, keyword));
    const states = await admissionStore.getStates(people.map(p => p.code));
    const results = people.map(p => combinedPerson(p, states.get(p.code)));
    return {success:true,found:results.length>0,results};
  }, callback);
}
function localCheckIn(code, callback) {
  admissionRequest(async () => {
    const data = await admissionStore.checkIn(code);
    return {...data, checkInTime:formatAdmissionTime(data.checkInTime)};
  }, callback);
}

let admissionStore = null;
let admissionClient = null;
let admissionsConfigured = false;
let admissionViewVersion = 0;
let visibleSearchResults = [];
let admissionSyncBusy = false;
let checkInPending = false;
let admissionStatsBusy = false;

async function refreshAdmissionStatistics() {
  const panel = document.getElementById('admissionStatistics');
  if (panel.hidden || document.hidden || admissionStatsBusy) return;
  const message = document.getElementById('admissionStatsMessage');
  admissionStatsBusy = true;
  message.textContent = '입장현황을 확인하고 있습니다.';
  try {
    if (!admissionsConfigured) throw new Error('입장 DB 연결 설정을 확인해 주세요.');
    if (!registrationLoaded) throw new Error('등록자 명단을 불러오는 중입니다. 잠시 후 다시 확인해 주세요.');
    const people = registrationList;
    const states = await admissionStore.getStates(people.map(p => p.code));
    const total = people.length;
    const admitted = people.filter(p => states.get(p.code).status === 'checked_in').length;
    const percentage = total ? admitted / total * 100 : 0;
    document.getElementById('admissionStatsCount').textContent = `${admitted}명 / ${total}명 입장`;
    document.getElementById('admissionStatsPercentage').textContent = `입장률 ${percentage.toFixed(1)}%`;
    document.getElementById('admissionProgress').value = percentage;
    message.textContent = '5초마다 자동 갱신 · ' +
      new Date().toLocaleTimeString('ko-KR', {timeZone:'Australia/Sydney'});
  } catch (error) {
    message.textContent = '최신 입장현황을 확인하지 못했습니다. · ' + error.message;
  } finally {
    admissionStatsBusy = false;
  }
}

function refreshAdmissionViews() {
  refreshVisibleAdmissions();
  refreshAdmissionStatistics();
}

async function refreshVisibleAdmissions() {
  if (!admissionsConfigured || admissionSyncBusy || checkInPending || document.hidden) return;
  const version = admissionViewVersion;
  const cardVisible = document.getElementById('personCard').style.display === 'block';
  const searchVisible = document.getElementById('nameSearchArea').style.display === 'block';
  const people = cardVisible
    ? [registrationByCode.get(currentQRCode)].filter(Boolean)
    : searchVisible ? visibleSearchResults : [];
  if (!people.length) return;
  admissionSyncBusy = true;
  try {
    const states = await admissionStore.getStates(people.map(p => p.code));
    if (version !== admissionViewVersion || checkInPending) return;
    const updated = people.map(p => combinedPerson(p, states.get(p.code)));
    if (cardVisible) displayPerson(updated[0]);
    else displaySearchResults(updated);
    document.getElementById('databaseMessage').textContent = '입장 상태 동기화됨 · ' +
      new Date().toLocaleTimeString('ko-KR', {timeZone:'Australia/Sydney'});
  } catch (error) {
    if (version !== admissionViewVersion) return;
    document.getElementById('databaseMessage').textContent =
      '입장 상태를 동기화하지 못했습니다. 연결을 확인해 주세요. · ' + error.message;
    if (cardVisible) document.getElementById('checkInButton').disabled = true;
  } finally {
    admissionSyncBusy = false;
  }
}
function initializeAdmissions() {
  const config = window.SUPABASE_CONFIG || {};
  const message = document.getElementById('databaseMessage');
  try {
    if (!config.url || !config.publishableKey) throw new Error('Supabase 연결 설정이 필요합니다. 관리자에게 문의해 주세요.');
    if (!window.supabase) throw new Error('입장 DB 연결 프로그램을 불러오지 못했습니다. 페이지를 새로고침해 주세요.');
    admissionClient = window.supabase.createClient(config.url, config.publishableKey, {
      auth: {persistSession:false, autoRefreshToken:false, detectSessionInUrl:false}
    });
    admissionStore = window.createAdmissionStore(admissionClient);
    admissionsConfigured = true;
    message.textContent = '입장 상태 자동 동기화 · 5초 간격';
    window.setInterval(refreshAdmissionViews, 5000);
    window.addEventListener('focus', refreshAdmissionViews);
    document.addEventListener('visibilitychange', refreshAdmissionViews);
  } catch (error) {
    message.textContent = error.message;
  }
  for (const id of ['cameraStartButton', 'nameSearchButton', 'scannerNameSearchButton']) {
    document.getElementById(id).disabled = !admissionsConfigured;
  }
}
loadRegistrations();
initializeAdmissions();
</script>
