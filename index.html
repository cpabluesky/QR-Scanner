<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>QR 입장 확인</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: Arial, "Noto Sans KR", sans-serif;
      background: #f5f5f5;
      margin: 0;
      padding: 20px;
      text-align: center;
    }

    .container {
      max-width: 500px;
      margin: 0 auto;
    }

    h2 {
      margin: 10px 0 20px;
      color: #333;
    }

    #reader {
      width: 100%;
      background: white;
      border-radius: 12px;
      overflow: hidden;
    }

    #status {
      margin-top: 18px;
      padding: 16px;
      background: white;
      border-radius: 10px;
      font-size: 17px;
      line-height: 1.5;
    }

    #personCard {
      display: none;
      margin-top: 18px;
      padding: 22px;
      background: white;
      border-radius: 12px;
      text-align: left;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
    }

    .name {
      font-size: 28px;
      font-weight: bold;
      margin-bottom: 18px;
      color: #333;
    }

    .row {
      padding: 10px 0;
      border-bottom: 1px solid #eee;
    }

    .label {
      font-size: 13px;
      color: #777;
      margin-bottom: 3px;
    }

    .value {
      font-size: 17px;
      color: #222;
    }

    .checkin-status {
      margin-top: 18px;
      padding: 15px;
      border-radius: 8px;
      text-align: center;
      line-height: 1.6;
    }

    .not-checked-in {
      background: #fff8e1;
    }

    .already-checked-in {
      background: #e8f5e9;
    }

    .completed {
      background: #e8f5e9;
      font-size: 18px;
    }

    .error {
      color: #b00020;
    }

    button {
      width: 100%;
      padding: 15px;
      margin-top: 16px;
      border: none;
      border-radius: 9px;
      font-size: 18px;
      cursor: pointer;
    }

    #checkInButton {
      background: #5b3b8c;
      color: white;
      font-weight: bold;
    }

    #scanAgainButton {
      background: #e0e0e0;
      color: #222;
    }

    button:disabled {
      opacity: 0.5;
      cursor: default;
    }
  </style>
</head>


<body>

<div class="container">

  <h2>QR 입장 확인</h2>

  <div id="reader"></div>

  <div id="status">
    카메라를 시작하고 있습니다...
  </div>


  <div id="personCard">

    <div id="personName" class="name"></div>


    <div class="row">
      <div class="label">이메일</div>
      <div id="personEmail" class="value"></div>
    </div>


    <div class="row">
      <div class="label">전화번호</div>
      <div id="personPhone" class="value"></div>
    </div>


    <div class="row">
      <div class="label">성별</div>
      <div id="personGender" class="value"></div>
    </div>


    <div class="row">
      <div class="label">연령대</div>
      <div id="personAge" class="value"></div>
    </div>


    <div id="checkInStatus"></div>


    <button
      id="checkInButton"
      onclick="confirmCheckIn()"
      style="display:none;">
      입장확인
    </button>


    <button
      id="scanAgainButton"
      onclick="restartScanner()">
      다음 사람 스캔
    </button>

  </div>

</div>


<script>

/* =====================================================
   GOOGLE APPS SCRIPT WEB APP
===================================================== */

const API_URL =
  "https://script.google.com/macros/s/AKfycbyrbrkLLohAK3JnfWCk89oJkoK-NaiDAD_Jc323DACOA1YKznW8TaDwo1JVN5DBG7_G/exec";


/* =====================================================
   VARIABLES
===================================================== */

let currentQRCode = "";

let scannerRunning = false;

let processing = false;

let requestCounter = 0;

const html5QrCode =
  new Html5Qrcode("reader");


/* =====================================================
   START SCANNER
===================================================== */

function startScanner() {

  processing = false;
  currentQRCode = "";

  document.getElementById("personCard")
    .style.display = "none";

  document.getElementById("status")
    .style.display = "block";

  document.getElementById("status")
    .innerHTML =
      "QR Code를 카메라에 보여주세요.";


  const config = {

    fps: 15,

    qrbox: function(viewfinderWidth, viewfinderHeight) {

      const size =
        Math.floor(
          Math.min(
            viewfinderWidth,
            viewfinderHeight
          ) * 0.7
        );

      return {
        width: size,
        height: size
      };
    }
  };


  html5QrCode.start(

    { facingMode: "environment" },

    config,

    onScanSuccess,

    function() {
      // QR을 찾는 동안 발생하는
      // 반복적인 scan error는 무시
    }

  )

  .then(function() {

    scannerRunning = true;

  })

  .catch(function(error) {

    scannerRunning = false;

    showError(
      "카메라를 시작할 수 없습니다.<br><br>" +
      escapeHtml(String(error))
    );

  });

}


/* =====================================================
   QR DETECTED
===================================================== */

function onScanSuccess(decodedText) {

  if (processing) {
    return;
  }

  processing = true;

  currentQRCode =
    String(decodedText).trim();


  document.getElementById("status")
    .innerHTML =
      "QR Code 확인 중...";


  html5QrCode.stop()

    .then(function() {

      scannerRunning = false;

      lookupPerson(currentQRCode);

    })

    .catch(function() {

      scannerRunning = false;

      lookupPerson(currentQRCode);

    });

}


/* =====================================================
   LOOKUP

   스캔 단계에서는 정보를 조회하기만 합니다.
   L열의 입장시각은 변경하지 않습니다.
===================================================== */

function lookupPerson(qrCode) {

  document.getElementById("status")
    .innerHTML =
      "등록정보를 확인하고 있습니다...";


  callApi(
    "lookup",
    qrCode,

    function(data) {

      if (!data || data.success !== true) {

        showError(
          data && data.message
            ? escapeHtml(data.message)
            : "등록정보를 확인할 수 없습니다."
        );

        return;
      }


      if (data.found !== true) {

        showError(
          "등록된 정보를 찾을 수 없습니다.<br><br>" +
          "QR Code: " +
          escapeHtml(qrCode)
        );

        return;
      }


      displayPerson(data);
    }
  );

}


/* =====================================================
   DISPLAY REGISTRATION INFORMATION
===================================================== */

function displayPerson(person) {

  document.getElementById("status")
    .style.display = "none";

  document.getElementById("personCard")
    .style.display = "block";


  document.getElementById("personName")
    .textContent =
      person.name || "";

  document.getElementById("personEmail")
    .textContent =
      person.email || "";

  document.getElementById("personPhone")
    .textContent =
      person.phone || "";

  document.getElementById("personGender")
    .textContent =
      person.gender || "";

  document.getElementById("personAge")
    .textContent =
      person.age || "";


  const status =
    document.getElementById("checkInStatus");

  const button =
    document.getElementById("checkInButton");


  /* -------------------------------------------------
     이미 입장한 경우
  ------------------------------------------------- */

  if (person.alreadyCheckedIn === true) {

    status.className =
      "checkin-status already-checked-in";

    status.innerHTML =
      "<strong>이미 입장했습니다.</strong>" +
      "<br>" +
      "입장시각: " +
      escapeHtml(person.checkInTime || "");


    // 다시 입장할 필요가 없으므로
    // 입장확인 버튼 숨김

    button.style.display =
      "none";

  }


  /* -------------------------------------------------
     아직 입장하지 않은 경우
  ------------------------------------------------- */

  else {

    status.className =
      "checkin-status not-checked-in";

    status.innerHTML =
      "아직 입장 처리되지 않았습니다.";


    button.style.display =
      "block";

    button.disabled =
      false;

    button.textContent =
      "입장확인";

  }

}


/* =====================================================
   CHECK-IN BUTTON

   사용자가 입장확인을 눌렀을 때만
   action=checkin을 호출합니다.
===================================================== */

function confirmCheckIn() {

  if (!currentQRCode) {
    return;
  }


  const button =
    document.getElementById("checkInButton");


  // 중복 클릭 방지

  button.disabled =
    true;

  button.textContent =
    "처리 중...";


  callApi(
    "checkin",
    currentQRCode,

    function(data) {

      if (!data || data.success !== true) {

        button.disabled =
          false;

        button.textContent =
          "입장확인";

        alert(
          data && data.message
            ? data.message
            : "입장 처리 중 오류가 발생했습니다."
        );

        return;
      }


      if (data.found !== true) {

        button.disabled =
          false;

        button.textContent =
          "입장확인";

        alert(
          "등록된 정보를 찾을 수 없습니다."
        );

        return;
      }


      const status =
        document.getElementById("checkInStatus");


      status.className =
        "checkin-status completed";


      /* -----------------------------------------------
         이미 입장되어 있던 경우
      ----------------------------------------------- */

      if (data.alreadyCheckedIn === true) {

        status.innerHTML =
          "<strong>이미 입장했습니다.</strong>" +
          "<br>" +
          "입장시각: " +
          escapeHtml(data.checkInTime || "");

      }


      /* -----------------------------------------------
         이번에 처음 입장 처리된 경우
      ----------------------------------------------- */

      else {

        status.innerHTML =
          "<strong>✓ 입장 완료</strong>" +
          "<br>" +
          "입장시각: " +
          escapeHtml(data.checkInTime || "");

      }


      button.style.display =
        "none";

    }
  );

}


/* =====================================================
   JSONP CALL

   GitHub Pages → Apps Script
===================================================== */

function callApi(action, qrCode, callback) {

  requestCounter++;


  const callbackName =
    "jsonpCallback_" +
    requestCounter +
    "_" +
    Date.now();


  const script =
    document.createElement("script");


  let timeout;


  /* -------------------------------------------------
     Apps Script가 실행할 callback
  ------------------------------------------------- */

  window[callbackName] =
    function(data) {

      clearTimeout(timeout);

      if (script.parentNode) {
        script.parentNode.removeChild(script);
      }

      delete window[callbackName];

      callback(data);
    };


  /* -------------------------------------------------
     Apps Script request
  ------------------------------------------------- */

  script.src =
    API_URL +
    "?action=" +
    encodeURIComponent(action) +
    "&code=" +
    encodeURIComponent(qrCode) +
    "&callback=" +
    encodeURIComponent(callbackName) +
    "&t=" +
    Date.now();


  /* -------------------------------------------------
     연결 오류
  ------------------------------------------------- */

  script.onerror =
    function() {

      clearTimeout(timeout);

      if (script.parentNode) {
        script.parentNode.removeChild(script);
      }

      delete window[callbackName];

      showError(
        "등록 데이터베이스에 연결할 수 없습니다."
      );
    };


  /* -------------------------------------------------
     15초 Timeout
  ------------------------------------------------- */

  timeout =
    setTimeout(function() {

      if (script.parentNode) {
        script.parentNode.removeChild(script);
      }

      delete window[callbackName];

      showError(
        "서버 응답 시간이 초과되었습니다."
      );

    }, 15000);


  document.body.appendChild(script);
}


/* =====================================================
   NEXT PERSON
===================================================== */

function restartScanner() {

  if (scannerRunning) {
    return;
  }


  document.getElementById("personCard")
    .style.display = "none";

  document.getElementById("status")
    .style.display = "block";

  document.getElementById("status")
    .innerHTML =
      "카메라를 다시 시작하고 있습니다...";


  startScanner();
}


/* =====================================================
   ERROR
===================================================== */

function showError(message) {

  document.getElementById("personCard")
    .style.display = "none";


  const status =
    document.getElementById("status");


  status.style.display =
    "block";


  status.innerHTML =
    '<div class="error">' +
    message +
    '</div>' +

    '<button onclick="restartScanner()">' +
    '다시 스캔' +
    '</button>';
}


/* =====================================================
   HTML ESCAPE
===================================================== */

function escapeHtml(value) {

  const div =
    document.createElement("div");


  div.textContent =
    String(
      value === undefined ||
      value === null
        ? ""
        : value
    );


  return div.innerHTML;
}


/* =====================================================
   START
===================================================== */

startScanner();

</script>

</body>

</html>
