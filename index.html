<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>입장 확인</title>

  <!-- QR Scanner Library -->
  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: Arial, "Noto Sans KR", sans-serif;
      background: #f5f5f5;
      margin: 0;
      padding: 20px;
      text-align: center;
      color: #222;
    }

    .container {
      max-width: 500px;
      margin: 0 auto;
    }

    h2 {
      margin: 10px 0 20px;
      color: #333;
    }

    #cameraStartArea,
    #nameSearchArea {
      background: white;
      padding: 22px;
      border-radius: 12px;
      margin-bottom: 18px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    #cameraStartArea p,
    #nameSearchArea p {
      margin-top: 0;
      line-height: 1.6;
    }

    #reader {
      width: 100%;
      background: white;
      border-radius: 12px;
      overflow: hidden;
    }

    #status {
      margin-top: 18px;
      padding: 16px;
      background: white;
      border-radius: 10px;
      font-size: 17px;
      line-height: 1.6;
    }

    #personCard {
      display: none;
      margin-top: 18px;
      padding: 22px;
      background: white;
      border-radius: 12px;
      text-align: left;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .name {
      font-size: 28px;
      font-weight: bold;
      margin-bottom: 18px;
      color: #333;
    }

    .row {
      padding: 10px 0;
      border-bottom: 1px solid #eee;
    }

    .label {
      font-size: 13px;
      color: #777;
      margin-bottom: 3px;
    }

    .value {
      font-size: 17px;
      color: #222;
      word-break: break-word;
    }

    .checkin-status {
      margin-top: 18px;
      padding: 16px;
      border-radius: 9px;
      text-align: center;
      line-height: 1.7;
    }

    .not-checked-in {
      background: #fff8e1;
    }

    .already-checked-in {
      background: #fff3cd;
    }

    .completed {
      background: #e8f5e9;
      font-size: 18px;
    }

    .error {
      color: #b00020;
    }

    button {
      width: 100%;
      padding: 15px;
      margin-top: 16px;
      border: none;
      border-radius: 9px;
      font-size: 18px;
      cursor: pointer;
    }

    #cameraStartButton,
    #checkInButton,
    #searchButton {
      background: #5b3b8c;
      color: white;
      font-weight: bold;
    }

    #nameSearchButton {
      background: #ffffff;
      color: #5b3b8c;
      border: 2px solid #5b3b8c;
      font-weight: bold;
    }

    #scanAgainButton,
    #backToScannerButton {
      background: #e0e0e0;
      color: #222;
    }

    button:disabled {
      opacity: 0.55;
      cursor: default;
    }

    /* =================================================
       NAME SEARCH
    ================================================= */

    #nameSearchArea {
      display: none;
    }

    #nameInput {
      width: 100%;
      padding: 15px;
      border: 1px solid #ccc;
      border-radius: 9px;
      font-size: 18px;
      outline: none;
    }

    #nameInput:focus {
      border-color: #5b3b8c;
    }

    #searchResults {
      margin-top: 18px;
      text-align: left;
    }

    .search-result {
      background: white;
      border: 1px solid #ddd;
      border-radius: 10px;
      padding: 15px;
      margin-bottom: 10px;
      cursor: pointer;
    }

    .search-result:hover {
      background: #f6f2fb;
      border-color: #5b3b8c;
    }

    .search-result-name {
      font-size: 20px;
      font-weight: bold;
      color: #333;
      margin-bottom: 6px;
    }

    .search-result-detail {
      font-size: 14px;
      color: #666;
      line-height: 1.5;
    }

    .search-result-status {
      margin-top: 7px;
      font-size: 14px;
    }

    .search-checked-in {
      color: #8a6d00;
    }

    .search-not-checked-in {
      color: #2e7d32;
    }
  </style>
</head>


<body>

<div class="container">

  <h2>입장 확인</h2>


  <!-- =================================================
       CAMERA START
  ================================================= -->

  <div id="cameraStartArea">

    <p>
      QR 코드를 스캔하려면 카메라 사용 권한이 필요합니다.
    </p>

    <button
      id="cameraStartButton"
      onclick="requestCamera()">
      카메라 시작
    </button>

    <button
      id="nameSearchButton"
      onclick="openNameSearch()">
      이름으로 찾기
    </button>

  </div>


  <!-- =================================================
       QR READER
  ================================================= -->

  <div id="reader"></div>


  <!-- =================================================
       NAME SEARCH
  ================================================= -->

  <div id="nameSearchArea">

    <p>
      이름의 일부를 입력해 주세요.
    </p>

    <input
      type="text"
      id="nameInput"
      placeholder="예: 승현"
      autocomplete="off"
      onkeydown="handleSearchKey(event)"
    >

    <button
      id="searchButton"
      onclick="searchByName()">
      검색
    </button>

    <div id="searchResults"></div>

    <button
      id="backToScannerButton"
      onclick="backToScanner()">
      QR 스캔으로 돌아가기
    </button>

  </div>


  <!-- =================================================
       STATUS
  ================================================= -->

  <div id="status">
    위의 「카메라 시작」 버튼을 누르거나
    「이름으로 찾기」를 선택해 주세요.
  </div>


  <!-- =================================================
       PERSON INFORMATION
  ================================================= -->

  <div id="personCard">

    <div id="personName" class="name"></div>


    <div class="row">
      <div class="label">이메일</div>
      <div id="personEmail" class="value"></div>
    </div>


    <div class="row">
      <div class="label">전화번호</div>
      <div id="personPhone" class="value"></div>
    </div>


    <div class="row">
      <div class="label">성별</div>
      <div id="personGender" class="value"></div>
    </div>


    <div class="row">
      <div class="label">연령대</div>
      <div id="personAge" class="value"></div>
    </div>


    <div id="checkInStatus"></div>


    <button
      id="checkInButton"
      onclick="confirmCheckIn()"
      style="display:none;">
      입장확인
    </button>


    <button
      id="scanAgainButton"
      onclick="nextPerson()">
      다음 사람
    </button>

  </div>

</div>


<script>

/* =====================================================
   GOOGLE APPS SCRIPT
===================================================== */

const API_URL =
  "https://script.google.com/macros/s/AKfycbyrbrkLLohAK3JnfWCk89oJkoK-NaiDAD_Jc323DACOA1YKznW8TaDwo1JVN5DBG7_G/exec";


/* =====================================================
   VARIABLES
===================================================== */

let currentQRCode = "";

let scannerRunning = false;

let processing = false;

let requestCounter = 0;

let selectedCameraId = null;

let currentMode = "scan";


const html5QrCode =
  new Html5Qrcode("reader");


/* =====================================================
   1. CAMERA START
===================================================== */

function requestCamera() {

  currentMode = "scan";

  document.getElementById(
    "nameSearchArea"
  ).style.display = "none";


  const button =
    document.getElementById(
      "cameraStartButton"
    );


  button.disabled = true;

  button.textContent =
    "카메라 연결 중...";


  document.getElementById(
    "status"
  ).innerHTML =
    "카메라 사용 권한을 확인하고 있습니다...";


  Html5Qrcode.getCameras()

    .then(function(cameras) {


      if (
        !cameras ||
        cameras.length === 0
      ) {

        throw new Error(
          "사용 가능한 카메라를 찾을 수 없습니다."
        );

      }


      let selectedCamera =
        cameras[cameras.length - 1];


      for (
        let i = 0;
        i < cameras.length;
        i++
      ) {

        const label =
          String(
            cameras[i].label || ""
          ).toLowerCase();


        if (
          label.includes("back") ||
          label.includes("rear") ||
          label.includes("environment")
        ) {

          selectedCamera =
            cameras[i];

          break;

        }

      }


      selectedCameraId =
        selectedCamera.id;


      return startScanner();

    })


    .catch(function(error) {


      selectedCameraId = null;

      button.disabled = false;

      button.textContent =
        "카메라 시작";


      document.getElementById(
        "cameraStartArea"
      ).style.display =
        "block";


      document.getElementById(
        "status"
      ).innerHTML =

        '<div class="error">' +

        '<strong>카메라를 사용할 수 없습니다.</strong>' +

        '<br><br>' +

        escapeHtml(
          String(error)
        ) +

        '</div>';

    });

}


/* =====================================================
   2. START SCANNER
===================================================== */

function startScanner() {

  if (!selectedCameraId) {

    return Promise.reject(
      new Error(
        "카메라가 선택되지 않았습니다."
      )
    );

  }


  currentMode = "scan";

  processing = false;

  currentQRCode = "";


  document.getElementById(
    "nameSearchArea"
  ).style.display =
    "none";


  document.getElementById(
    "personCard"
  ).style.display =
    "none";


  document.getElementById(
    "status"
  ).style.display =
    "block";


  document.getElementById(
    "status"
  ).innerHTML =
    "카메라를 시작하고 있습니다...";


  const config = {

    fps: 10,

    qrbox: {
      width: 250,
      height: 250
    }

  };


  return html5QrCode.start(

    selectedCameraId,

    config,

    onScanSuccess,

    function(errorMessage) {

      /* 반복 scan error 무시 */

    }

  )

  .then(function() {


    scannerRunning = true;


    document.getElementById(
      "cameraStartArea"
    ).style.display =
      "none";


    document.getElementById(
      "status"
    ).innerHTML =
      "QR Code를 카메라에 보여주세요.";

  });

}


/* =====================================================
   3. QR CODE DETECTED
===================================================== */

function onScanSuccess(decodedText) {

  if (processing) {
    return;
  }


  processing = true;


  currentQRCode =
    String(decodedText).trim();


  document.getElementById(
    "status"
  ).innerHTML =

    "QR Code를 인식했습니다." +

    "<br>" +

    "등록정보를 확인하고 있습니다...";


  html5QrCode.stop()

    .then(function() {


      scannerRunning = false;

      lookupPerson(
        currentQRCode
      );

    })

    .catch(function() {


      scannerRunning = false;

      lookupPerson(
        currentQRCode
      );

    });

}


/* =====================================================
   4. LOOKUP PERSON
===================================================== */

function lookupPerson(qrCode) {

  callApi(

    "lookup",

    {
      code: qrCode
    },

    function(data) {


      if (
        !data ||
        data.success !== true
      ) {

        showError(

          data &&
          data.message

            ? escapeHtml(
                data.message
              )

            : "등록정보를 확인할 수 없습니다."

        );

        return;

      }


      if (
        data.found !== true
      ) {

        showError(

          "등록된 정보를 찾을 수 없습니다." +

          "<br><br>" +

          "QR Code: " +

          escapeHtml(qrCode)

        );

        return;

      }


      displayPerson(data);

    }

  );

}


/* =====================================================
   5. OPEN NAME SEARCH
===================================================== */

function openNameSearch() {

  currentMode = "search";

  currentQRCode = "";

  processing = false;


  /*
     카메라가 실행 중이라면 중지
  */

  if (scannerRunning) {

    html5QrCode.stop()
      .then(function() {
        scannerRunning = false;
      })
      .catch(function() {
        scannerRunning = false;
      });

  }


  document.getElementById(
    "cameraStartArea"
  ).style.display =
    "none";


  document.getElementById(
    "personCard"
  ).style.display =
    "none";


  document.getElementById(
    "status"
  ).style.display =
    "none";


  document.getElementById(
    "nameSearchArea"
  ).style.display =
    "block";


  document.getElementById(
    "searchResults"
  ).innerHTML =
    "";


  const input =
    document.getElementById(
      "nameInput"
    );


  input.value = "";

  setTimeout(function() {
    input.focus();
  }, 100);

}


/* =====================================================
   6. ENTER KEY SEARCH
===================================================== */

function handleSearchKey(event) {

  if (event.key === "Enter") {

    event.preventDefault();

    searchByName();

  }

}


/* =====================================================
   7. SEARCH BY NAME
===================================================== */

function searchByName() {

  const input =
    document.getElementById(
      "nameInput"
    );


  const keyword =
    String(
      input.value || ""
    ).trim();


  const resultsArea =
    document.getElementById(
      "searchResults"
    );


  if (!keyword) {

    resultsArea.innerHTML =
      '<div class="error">' +
      '검색할 이름을 입력해 주세요.' +
      '</div>';

    return;

  }


  const button =
    document.getElementById(
      "searchButton"
    );


  button.disabled = true;

  button.textContent =
    "검색 중...";


  resultsArea.innerHTML =
    "검색하고 있습니다...";


  callApi(

    "search",

    {
      keyword: keyword
    },

    function(data) {


      button.disabled = false;

      button.textContent = "검색";


      if (
        !data ||
        data.success !== true
      ) {

        resultsArea.innerHTML =

          '<div class="error">' +

          escapeHtml(
            data && data.message
              ? data.message
              : "검색 중 오류가 발생했습니다."
          ) +

          '</div>';

        return;

      }


      if (
        data.found !== true ||
        !Array.isArray(data.results) ||
        data.results.length === 0
      ) {

        resultsArea.innerHTML =

          '<div class="error">' +

          '일치하는 이름을 찾을 수 없습니다.' +

          '</div>';

        return;

      }


      displaySearchResults(
        data.results
      );

    }

  );

}


/* =====================================================
   8. DISPLAY SEARCH RESULTS
===================================================== */

function displaySearchResults(results) {

  const resultsArea =
    document.getElementById(
      "searchResults"
    );


  resultsArea.innerHTML = "";


  const summary =
    document.createElement("div");


  summary.style.marginBottom =
    "12px";


  summary.textContent =
    results.length +
    "명의 검색 결과가 있습니다.";


  resultsArea.appendChild(
    summary
  );


  results.forEach(
    function(person) {


      const item =
        document.createElement("div");


      item.className =
        "search-result";


      const name =
        document.createElement("div");


      name.className =
        "search-result-name";


      name.textContent =
        person.name || "";


      const detail =
        document.createElement("div");


      detail.className =
        "search-result-detail";


      detail.textContent =
        [
          person.email || "",
          person.phone || "",
          person.gender || "",
          person.age || ""
        ]
        .filter(Boolean)
        .join(" · ");


      const checkStatus =
        document.createElement("div");


      checkStatus.className =
        "search-result-status " +
        (
          person.alreadyCheckedIn
            ? "search-checked-in"
            : "search-not-checked-in"
        );


      if (person.alreadyCheckedIn) {

        checkStatus.textContent =
          "이미 입장 · " +
          (
            person.checkInTime || ""
          );

      }

      else {

        checkStatus.textContent =
          "미입장";

      }


      item.appendChild(name);

      item.appendChild(detail);

      item.appendChild(checkStatus);


      /*
         검색 결과 선택
      */

      item.onclick =
        function() {

          selectSearchResult(
            person
          );

        };


      resultsArea.appendChild(
        item
      );

    }

  );

}


/* =====================================================
   9. SELECT SEARCH RESULT

   검색 결과를 선택하면 해당 사람의 QR Code를
   currentQRCode에 저장합니다.

   이후 기존 입장확인 기능을 그대로 사용합니다.
===================================================== */

function selectSearchResult(person) {

  if (
    !person ||
    !person.code
  ) {

    alert(
      "이 등록정보에는 QR Code가 없습니다."
    );

    return;

  }


  currentQRCode =
    String(
      person.code
    ).trim();


  currentMode = "search";


  document.getElementById(
    "nameSearchArea"
  ).style.display =
    "none";


  displayPerson(person);

}


/* =====================================================
   10. DISPLAY PERSON
===================================================== */

function displayPerson(person) {

  document.getElementById(
    "status"
  ).style.display =
    "none";


  document.getElementById(
    "personCard"
  ).style.display =
    "block";


  document.getElementById(
    "personName"
  ).textContent =
    person.name || "";


  document.getElementById(
    "personEmail"
  ).textContent =
    person.email || "";


  document.getElementById(
    "personPhone"
  ).textContent =
    person.phone || "";


  document.getElementById(
    "personGender"
  ).textContent =
    person.gender || "";


  document.getElementById(
    "personAge"
  ).textContent =
    person.age || "";


  const status =
    document.getElementById(
      "checkInStatus"
    );


  const button =
    document.getElementById(
      "checkInButton"
    );


  if (
    person.alreadyCheckedIn === true
  ) {

    status.className =
      "checkin-status already-checked-in";


    status.innerHTML =

      "<strong>이미 입장했습니다.</strong>" +

      "<br>" +

      "입장시각: " +

      escapeHtml(
        person.checkInTime || ""
      );


    button.style.display =
      "none";

  }

  else {

    status.className =
      "checkin-status not-checked-in";


    status.innerHTML =
      "아직 입장 처리되지 않았습니다.";


    button.style.display =
      "block";


    button.disabled =
      false;


    button.textContent =
      "입장확인";

  }

}


/* =====================================================
   11. CHECK-IN
===================================================== */

function confirmCheckIn() {

  if (!currentQRCode) {
    return;
  }


  const button =
    document.getElementById(
      "checkInButton"
    );


  button.disabled = true;

  button.textContent =
    "입장 처리 중...";


  callApi(

    "checkin",

    {
      code: currentQRCode
    },

    function(data) {


      if (
        !data ||
        data.success !== true
      ) {

        button.disabled =
          false;


        button.textContent =
          "입장확인";


        alert(

          data &&
          data.message

            ? data.message

            : "입장 처리 중 오류가 발생했습니다."

        );

        return;

      }


      if (
        data.found !== true
      ) {

        button.disabled =
          false;


        button.textContent =
          "입장확인";


        alert(
          "등록된 정보를 찾을 수 없습니다."
        );

        return;

      }


      const status =
        document.getElementById(
          "checkInStatus"
        );


      if (
        data.alreadyCheckedIn === true
      ) {

        status.className =
          "checkin-status already-checked-in";


        status.innerHTML =

          "<strong>이미 입장했습니다.</strong>" +

          "<br>" +

          "입장시각: " +

          escapeHtml(
            data.checkInTime || ""
          );

      }

      else {

        status.className =
          "checkin-status completed";


        status.innerHTML =

          "<strong>✓ 입장 완료</strong>" +

          "<br>" +

          "입장시각: " +

          escapeHtml(
            data.checkInTime || ""
          );

      }


      button.style.display =
        "none";

    }

  );

}


/* =====================================================
   12. JSONP API

   lookup:
   action=lookup&code=...

   checkin:
   action=checkin&code=...

   search:
   action=search&keyword=...
===================================================== */

function callApi(
  action,
  params,
  callback
) {

  requestCounter++;


  const callbackName =

    "jsonpCallback_" +

    requestCounter +

    "_" +

    Date.now();


  const script =
    document.createElement(
      "script"
    );


  let timeout;


  window[callbackName] =
    function(data) {


      clearTimeout(
        timeout
      );


      if (
        script.parentNode
      ) {

        script.parentNode.removeChild(
          script
        );

      }


      delete window[
        callbackName
      ];


      callback(data);

    };


  /*
     URL 생성
  */

  let url =

    API_URL +

    "?action=" +

    encodeURIComponent(
      action
    );


  Object.keys(
    params || {}
  ).forEach(
    function(key) {

      url +=

        "&" +

        encodeURIComponent(key) +

        "=" +

        encodeURIComponent(
          params[key]
        );

    }
  );


  url +=

    "&callback=" +

    encodeURIComponent(
      callbackName
    ) +

    "&t=" +

    Date.now();


  script.src =
    url;


  script.onerror =
    function() {


      clearTimeout(
        timeout
      );


      if (
        script.parentNode
      ) {

        script.parentNode.removeChild(
          script
        );

      }


      delete window[
        callbackName
      ];


      showError(
        "등록 데이터베이스에 연결할 수 없습니다."
      );

    };


  timeout =
    setTimeout(

      function() {


        if (
          script.parentNode
        ) {

          script.parentNode.removeChild(
            script
          );

        }


        delete window[
          callbackName
        ];


        showError(
          "서버 응답 시간이 초과되었습니다."
        );


      },

      15000

    );


  document.body.appendChild(
    script
  );

}


/* =====================================================
   13. NEXT PERSON
===================================================== */

function nextPerson() {

  currentQRCode = "";

  processing = false;


  document.getElementById(
    "personCard"
  ).style.display =
    "none";


  /*
     이름 검색으로 들어온 경우에는
     다시 이름 검색 화면으로 이동
  */

  if (
    currentMode === "search"
  ) {

    openNameSearch();

    return;

  }


  restartScanner();

}


/* =====================================================
   14. RESTART SCANNER
===================================================== */

function restartScanner() {

  currentMode = "scan";


  if (
    scannerRunning
  ) {

    return;

  }


  processing = false;

  currentQRCode = "";


  document.getElementById(
    "nameSearchArea"
  ).style.display =
    "none";


  document.getElementById(
    "personCard"
  ).style.display =
    "none";


  document.getElementById(
    "status"
  ).style.display =
    "block";


  document.getElementById(
    "status"
  ).innerHTML =
    "카메라를 다시 시작하고 있습니다...";


  if (
    selectedCameraId
  ) {

    startScanner()

      .catch(function(error) {


        document.getElementById(
          "status"
        ).innerHTML =

          '<div class="error">' +

          '카메라를 다시 시작할 수 없습니다.' +

          '<br><br>' +

          escapeHtml(
            String(error)
          ) +

          '</div>';

      });

  }

  else {

    document.getElementById(
      "cameraStartArea"
    ).style.display =
      "block";


    document.getElementById(
      "status"
    ).innerHTML =
      "위의 「카메라 시작」 버튼을 누르거나 「이름으로 찾기」를 선택해 주세요.";

  }

}


/* =====================================================
   15. BACK TO QR SCANNER
===================================================== */

function backToScanner() {

  currentMode = "scan";

  currentQRCode = "";

  processing = false;


  document.getElementById(
    "nameSearchArea"
  ).style.display =
    "none";


  document.getElementById(
    "personCard"
  ).style.display =
    "none";


  document.getElementById(
    "status"
  ).style.display =
    "block";


  if (
    selectedCameraId
  ) {

    document.getElementById(
      "status"
    ).innerHTML =
      "카메라를 다시 시작하고 있습니다...";


    startScanner()

      .catch(function(error) {

        showError(
          "카메라를 다시 시작할 수 없습니다.<br><br>" +
          escapeHtml(
            String(error)
          )
        );

      });

  }

  else {

    document.getElementById(
      "cameraStartArea"
    ).style.display =
      "block";


    document.getElementById(
      "status"
    ).innerHTML =
      "위의 「카메라 시작」 버튼을 눌러주세요.";

  }

}


/* =====================================================
   16. ERROR DISPLAY
===================================================== */

function showError(message) {

  document.getElementById(
    "personCard"
  ).style.display =
    "none";


  const status =
    document.getElementById(
      "status"
    );


  status.style.display =
    "block";


  status.innerHTML =

    '<div class="error">' +

    message +

    '</div>' +

    '<button onclick="restartScanner()">' +

    '다시 스캔' +

    '</button>';

}


/* =====================================================
   17. HTML ESCAPE
===================================================== */

function escapeHtml(value) {

  const div =
    document.createElement(
      "div"
    );


  div.textContent =

    String(

      value === undefined ||
      value === null

        ? ""

        : value

    );


  return div.innerHTML;

}

</script>
