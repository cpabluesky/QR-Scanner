<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>입장 확인</title>

  <!-- QR Scanner Library -->
  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      font-family: Arial, "Noto Sans KR", sans-serif;
      background: #f5f5f5;
      margin: 0;
      padding: 20px;
      text-align: center;
      color: #222;
    }

    .container {
      max-width: 500px;
      margin: 0 auto;
    }

    h2 {
      margin: 10px 0 20px;
      color: #333;
    }


    /* =================================================
       CAMERA START
    ================================================= */

    #cameraStartArea {
      background: white;
      padding: 22px;
      border-radius: 12px;
      margin-bottom: 18px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    #cameraStartArea p {
      margin-top: 0;
      line-height: 1.6;
    }


    /* =================================================
       QR READER
    ================================================= */

    #reader {
      width: 100%;
      background: white;
      border-radius: 12px;
      overflow: hidden;
    }


    /*
       카메라 실행 중 표시되는
       이름 검색 버튼 영역
    */

    #scannerSearchArea {
      display: none;
      margin-top: 10px;
    }


    /* =================================================
       STATUS
    ================================================= */

    #status {
      margin-top: 18px;
      padding: 16px;
      background: white;
      border-radius: 10px;
      font-size: 17px;
      line-height: 1.6;
    }


    /* =================================================
       NAME SEARCH
    ================================================= */

    #nameSearchArea {
      display: none;
      background: white;
      padding: 22px;
      border-radius: 12px;
      margin-bottom: 18px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    #nameSearchArea p {
      margin-top: 0;
      line-height: 1.6;
    }

    #nameInput {
      width: 100%;
      padding: 15px;
      border: 1px solid #ccc;
      border-radius: 9px;
      font-size: 18px;
      outline: none;
    }

    #nameInput:focus {
      border-color: #5b3b8c;
    }

    #searchResults {
      margin-top: 18px;
      text-align: left;
    }

    .search-result {
      background: white;
      border: 1px solid #ddd;
      border-radius: 10px;
      padding: 15px;
      margin-bottom: 10px;
      cursor: pointer;
    }

    .search-result:hover {
      background: #f6f2fb;
      border-color: #5b3b8c;
    }

    .search-result-name {
      font-size: 20px;
      font-weight: bold;
      color: #333;
      margin-bottom: 6px;
    }

    .search-result-detail {
      font-size: 14px;
      color: #666;
      line-height: 1.5;
    }

    .search-result-status {
      margin-top: 7px;
      font-size: 14px;
    }

    .search-checked-in {
      color: #8a6d00;
    }

    .search-not-checked-in {
      color: #2e7d32;
    }


    /* =================================================
       PERSON CARD
    ================================================= */

    #personCard {
      display: none;
      margin-top: 18px;
      padding: 22px;
      background: white;
      border-radius: 12px;
      text-align: left;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .name {
      font-size: 28px;
      font-weight: bold;
      margin-bottom: 18px;
      color: #333;
    }

    .row {
      padding: 10px 0;
      border-bottom: 1px solid #eee;
    }

    .label {
      font-size: 13px;
      color: #777;
      margin-bottom: 3px;
    }

    .value {
      font-size: 17px;
      color: #222;
      word-break: break-word;
    }


    /* =================================================
       CHECK-IN STATUS
    ================================================= */

    .checkin-status {
      margin-top: 18px;
      padding: 16px;
      border-radius: 9px;
      text-align: center;
      line-height: 1.7;
    }

    .not-checked-in {
      background: #fff8e1;
    }

    .already-checked-in {
      background: #fff3cd;
    }

    .completed {
      background: #e8f5e9;
      font-size: 18px;
    }

    .error {
      color: #b00020;
    }


    /* =================================================
       BUTTONS
    ================================================= */

    button {
      width: 100%;
      padding: 15px;
      margin-top: 16px;
      border: none;
      border-radius: 9px;
      font-size: 18px;
      cursor: pointer;
    }

    #cameraStartButton,
    #checkInButton,
    #searchButton {
      background: #5b3b8c;
      color: white;
      font-weight: bold;
    }

    #nameSearchButton,
    #scannerNameSearchButton {
      background: white;
      color: #5b3b8c;
      border: 2px solid #5b3b8c;
      font-weight: bold;
    }

    #scannerNameSearchButton {
      margin-top: 0;
    }

    #scanAgainButton,
    #backToScannerButton {
      background: #e0e0e0;
      color: #222;
    }

    button:disabled {
      opacity: 0.55;
      cursor: default;
    }

    .topbar { position:relative; display:flex; align-items:center; justify-content:center; min-height:62px; margin-bottom:12px; }
    .topbar h2 { margin:10px 0; }
    #settingsToggle { position:absolute; right:0; top:50%; transform:translateY(-50%); width:auto; margin:0; padding:8px 10px; border:0; background:transparent; color:#5b3b8c; font-size:14px; font-weight:600; }
    #settingsToggle:hover, #settingsToggle:focus-visible { text-decoration:underline; }
    #dataControls[hidden] { display:none !important; }
  </style>

</head>


<body>

<div class="container">

  <div class="topbar"><h2>입장 확인</h2><button id="settingsToggle" type="button" aria-expanded="false" aria-controls="dataControls" onclick="toggleSettings()">설정 <span aria-hidden="true">⚙</span></button></div>
<div id="dataControls" hidden style="background:white;padding:12px;border-radius:10px;margin-bottom:15px;text-align:left">
  <div id="dataInfo" style="font-size:13px;line-height:1.6">저장된 명단을 확인하고 있습니다.</div>
  <button type="button" onclick="refreshRegistrations()" style="font-size:15px;background:#5b3b8c;color:white">관리자: 명단 새로고침</button>
</div>


  <!-- =================================================
       INITIAL SCREEN
  ================================================= -->

  <div id="cameraStartArea">

    <p>
      QR 코드를 스캔하거나 이름으로 등록자를 찾을 수 있습니다.
    </p>

    <button
      id="cameraStartButton"
      onclick="requestCamera()">
      QR 코드 스캔
    </button>

    <button
      id="nameSearchButton"
      onclick="openNameSearch()">
      이름으로 찾기
    </button>

  </div>


  <!-- =================================================
       QR READER
  ================================================= -->

  <div id="reader"></div>


  <!-- =================================================
       NAME SEARCH BUTTON DURING SCANNING
  ================================================= -->

  <div id="scannerSearchArea">

    <button
      id="scannerNameSearchButton"
      onclick="openNameSearch()">
      이름으로 찾기
    </button>

  </div>


  <!-- =================================================
       NAME SEARCH
  ================================================= -->

  <div id="nameSearchArea">

    <p>
      이름을 입력해 주세요
    </p>

    <input
      type="text"
      id="nameInput"
      placeholder="예: 승현"
      autocomplete="off"
      onkeydown="handleSearchKey(event)"
    >

    <button
      id="searchButton"
      onclick="searchByName()">
      검색
    </button>

    <div id="searchResults"></div>

    <button
      id="backToScannerButton"
      onclick="backToScanner()">
      QR 스캔으로 돌아가기
    </button>

  </div>


  <!-- =================================================
       STATUS
  ================================================= -->

  <div id="status">
    QR 코드 스캔 또는 이름으로 찾기를 선택해 주세요.
  </div>


  <!-- =================================================
       PERSON INFORMATION
  ================================================= -->

  <div id="personCard">

    <div
      id="personName"
      class="name">
    </div>


    <div class="row">

      <div class="label">
        이메일
      </div>

      <div
        id="personEmail"
        class="value">
      </div>

    </div>


    <div class="row">

      <div class="label">
        전화번호
      </div>

      <div
        id="personPhone"
        class="value">
      </div>

    </div>


    <div class="row">

      <div class="label">
        성별
      </div>

      <div
        id="personGender"
        class="value">
      </div>

    </div>


    <div class="row">

      <div class="label">
        연령대
      </div>

      <div
        id="personAge"
        class="value">
      </div>

    </div>


    <div id="checkInStatus"></div>


    <button
      id="checkInButton"
      onclick="confirmCheckIn()"
      style="display:none;">
      입장확인
    </button>


    <button
      id="scanAgainButton"
      onclick="nextPerson()">
      다음 사람
    </button>

  </div>

</div>


<script>

/* =====================================================
   GOOGLE APPS SCRIPT
===================================================== */

const API_URL =
  "https://script.google.com/macros/s/AKfycbyrbrkLLohAK3JnfWCk89oJkoK-NaiDAD_Jc323DACOA1YKznW8TaDwo1JVN5DBG7_G/exec";


/* =====================================================
   VARIABLES
===================================================== */

let currentQRCode = "";

let scannerRunning = false;

let processing = false;

let requestCounter = 0;

let selectedCameraId = null;

let currentMode = "scan";


const html5QrCode =
  new Html5Qrcode("reader");


/* =====================================================
   1. CAMERA START
===================================================== */

function requestCamera() {

  currentMode = "scan";


  document.getElementById(
    "nameSearchArea"
  ).style.display =
    "none";


  const button =
    document.getElementById(
      "cameraStartButton"
    );


  button.disabled =
    true;


  button.textContent =
    "카메라 연결 중...";


  document.getElementById(
    "status"
  ).innerHTML =
    "카메라 사용 권한을 확인하고 있습니다...";


  Html5Qrcode.getCameras()

    .then(function(cameras) {


      if (
        !cameras ||
        cameras.length === 0
      ) {

        throw new Error(
          "사용 가능한 카메라를 찾을 수 없습니다."
        );

      }


      /*
         기본적으로 마지막 카메라 선택
      */

      let selectedCamera =
        cameras[cameras.length - 1];


      /*
         후면 카메라 우선 검색
      */

      for (
        let i = 0;
        i < cameras.length;
        i++
      ) {

        const label =
          String(
            cameras[i].label || ""
          ).toLowerCase();


        if (
          label.includes("back") ||
          label.includes("rear") ||
          label.includes("environment")
        ) {

          selectedCamera =
            cameras[i];

          break;

        }

      }


      selectedCameraId =
        selectedCamera.id;


      return startScanner();

    })


    .catch(function(error) {


      selectedCameraId =
        null;


      button.disabled =
        false;


      button.textContent =
        "QR 코드 스캔";


      document.getElementById(
        "cameraStartArea"
      ).style.display =
        "block";


      document.getElementById(
        "scannerSearchArea"
      ).style.display =
        "none";


      document.getElementById(
        "status"
      ).innerHTML =

        '<div class="error">' +

        '<strong>카메라를 사용할 수 없습니다.</strong>' +

        '<br><br>' +

        escapeHtml(
          String(error)
        ) +

        '</div>';

    });

}


/* =====================================================
   2. START SCANNER
===================================================== */

function startScanner() {

  if (!selectedCameraId) {

    return Promise.reject(

      new Error(
        "카메라가 선택되지 않았습니다."
      )

    );

  }


  currentMode =
    "scan";


  processing =
    false;


  currentQRCode =
    "";


  document.getElementById(
    "nameSearchArea"
  ).style.display =
    "none";


  document.getElementById(
    "personCard"
  ).style.display =
    "none";


  document.getElementById(
    "status"
  ).style.display =
    "block";


  document.getElementById(
    "status"
  ).innerHTML =
    "카메라를 시작하고 있습니다...";


  const config = {

    fps: 10,

    qrbox: {

      width: 250,

      height: 250

    }

  };


  return html5QrCode.start(

    selectedCameraId,

    config,

    onScanSuccess,

    function(errorMessage) {

      /*
         반복적인 QR scan error는 무시
      */

    }

  )

  .then(function() {


    scannerRunning =
      true;


    /*
       초기 화면 숨김
    */

    document.getElementById(
      "cameraStartArea"
    ).style.display =
      "none";


    /*
       카메라 아래 이름 검색 버튼 표시
    */

    document.getElementById(
      "scannerSearchArea"
    ).style.display =
      "block";


    document.getElementById(
      "status"
    ).innerHTML =
      "QR Code를 카메라에 보여주세요.";

  });

}


/* =====================================================
   3. QR CODE DETECTED
===================================================== */

function onScanSuccess(decodedText) {

  if (processing) {

    return;

  }


  processing =
    true;


  currentQRCode =
    String(
      decodedText
    ).trim();


  /*
     QR 인식 후 이름검색 버튼 숨김
  */

  document.getElementById(
    "scannerSearchArea"
  ).style.display =
    "none";


  document.getElementById(
    "status"
  ).innerHTML =

    "QR Code를 인식했습니다." +

    "<br>" +

    "등록정보를 확인하고 있습니다...";


  html5QrCode.stop()

    .then(function() {


      scannerRunning =
        false;


      lookupPerson(
        currentQRCode
      );

    })


    .catch(function() {


      scannerRunning =
        false;


      lookupPerson(
        currentQRCode
      );

    });

}


/* =====================================================
   4. LOOKUP PERSON
===================================================== */

function lookupPerson(qrCode) {

  localLookup(qrCode, function(data) {


      if (
        !data ||
        data.success !== true
      ) {

        showError(

          data &&
          data.message

            ? escapeHtml(
                data.message
              )

            : "등록정보를 확인할 수 없습니다."

        );

        return;

      }


      if (
        data.found !== true
      ) {

        showError(

          "등록된 정보를 찾을 수 없습니다." +

          "<br><br>" +

          "QR Code: " +

          escapeHtml(
            qrCode
          )

        );

        return;

      }


      displayPerson(
        data
      );

    }

  );

}


/* =====================================================
   5. OPEN NAME SEARCH

   초기 화면 또는
   카메라 스캔 화면에서 호출 가능
===================================================== */

function openNameSearch() {

  currentMode =
    "search";


  currentQRCode =
    "";


  processing =
    false;


  /*
     스캔 화면의 이름 검색 버튼 숨김
  */

  document.getElementById(
    "scannerSearchArea"
  ).style.display =
    "none";


  /*
     카메라 실행 중이면 먼저 중지
  */

  if (scannerRunning) {

    html5QrCode.stop()

      .then(function() {

        scannerRunning =
          false;

      })

      .catch(function() {

        scannerRunning =
          false;

      });

  }


  document.getElementById(
    "cameraStartArea"
  ).style.display =
    "none";


  document.getElementById(
    "personCard"
  ).style.display =
    "none";


  document.getElementById(
    "status"
  ).style.display =
    "none";


  document.getElementById(
    "nameSearchArea"
  ).style.display =
    "block";


  document.getElementById(
    "searchResults"
  ).innerHTML =
    "";


  const input =
    document.getElementById(
      "nameInput"
    );


  input.value =
    "";


  setTimeout(

    function() {

      input.focus();

    },

    100

  );

}


/* =====================================================
   6. ENTER KEY SEARCH
===================================================== */

function handleSearchKey(event) {

  if (
    event.key === "Enter"
  ) {

    event.preventDefault();

    searchByName();

  }

}


/* =====================================================
   7. SEARCH BY NAME
===================================================== */

function searchByName() {

  const input =
    document.getElementById(
      "nameInput"
    );


  const keyword =
    String(
      input.value || ""
    ).trim();


  const resultsArea =
    document.getElementById(
      "searchResults"
    );


  if (!keyword) {

    resultsArea.innerHTML =

      '<div class="error">' +

      '검색할 이름을 입력해 주세요.' +

      '</div>';

    return;

  }


  const button =
    document.getElementById(
      "searchButton"
    );


  button.disabled =
    true;


  button.textContent =
    "검색 중...";


  resultsArea.innerHTML =
    "검색하고 있습니다...";


  localSearch(keyword, function(data) {


      button.disabled =
        false;


      button.textContent =
        "검색";


      if (
        !data ||
        data.success !== true
      ) {

        resultsArea.innerHTML =

          '<div class="error">' +

          escapeHtml(

            data &&
            data.message

              ? data.message

              : "검색 중 오류가 발생했습니다."

          ) +

          '</div>';

        return;

      }


      if (
        data.found !== true ||
        !Array.isArray(
          data.results
        ) ||
        data.results.length === 0
      ) {

        resultsArea.innerHTML =

          '<div class="error">' +

          '일치하는 이름을 찾을 수 없습니다.' +

          '</div>';

        return;

      }


      displaySearchResults(
        data.results
      );

    }

  );

}


/* =====================================================
   8. DISPLAY SEARCH RESULTS
===================================================== */

function displaySearchResults(results) {

  const resultsArea =
    document.getElementById(
      "searchResults"
    );


  resultsArea.innerHTML =
    "";


  const summary =
    document.createElement(
      "div"
    );


  summary.style.marginBottom =
    "12px";


  summary.textContent =

    results.length +

    "명의 검색 결과가 있습니다.";


  resultsArea.appendChild(
    summary
  );


  results.forEach(

    function(person) {


      const item =
        document.createElement(
          "div"
        );


      item.className =
        "search-result";


      const name =
        document.createElement(
          "div"
        );


      name.className =
        "search-result-name";


      name.textContent =
        person.name || "";


      const detail =
        document.createElement(
          "div"
        );


      detail.className =
        "search-result-detail";


      detail.textContent =

        [

          person.email || "",

          person.phone || "",

          person.gender || "",

          person.age || ""

        ]

        .filter(Boolean)

        .join(" · ");


      const checkStatus =
        document.createElement(
          "div"
        );


      checkStatus.className =

        "search-result-status " +

        (
          person.alreadyCheckedIn

            ? "search-checked-in"

            : "search-not-checked-in"
        );


      if (
        person.alreadyCheckedIn
      ) {

        checkStatus.textContent =

          "이미 입장 · " +

          (
            person.checkInTime || ""
          );

      }

      else {

        checkStatus.textContent =
          "미입장";

      }


      item.appendChild(
        name
      );


      item.appendChild(
        detail
      );


      item.appendChild(
        checkStatus
      );


      item.onclick =
        function() {

          selectSearchResult(
            person
          );

        };


      resultsArea.appendChild(
        item
      );

    }

  );

}


/* =====================================================
   9. SELECT SEARCH RESULT
===================================================== */

function selectSearchResult(person) {

  if (
    !person ||
    !person.code
  ) {

    alert(
      "이 등록정보에는 QR Code가 없습니다."
    );

    return;

  }


  currentQRCode =
    String(
      person.code
    ).trim();


  currentMode =
    "search";


  document.getElementById(
    "nameSearchArea"
  ).style.display =
    "none";


  displayPerson(
    person
  );

}


/* =====================================================
   10. DISPLAY PERSON
===================================================== */

function displayPerson(person) {

  document.getElementById(
    "scannerSearchArea"
  ).style.display =
    "none";


  document.getElementById(
    "status"
  ).style.display =
    "none";


  document.getElementById(
    "personCard"
  ).style.display =
    "block";


  document.getElementById(
    "personName"
  ).textContent =
    person.name || "";


  document.getElementById(
    "personEmail"
  ).textContent =
    person.email || "";


  document.getElementById(
    "personPhone"
  ).textContent =
    person.phone || "";


  document.getElementById(
    "personGender"
  ).textContent =
    person.gender || "";


  document.getElementById(
    "personAge"
  ).textContent =
    person.age || "";


  const status =
    document.getElementById(
      "checkInStatus"
    );


  const button =
    document.getElementById(
      "checkInButton"
    );


  /*
     이미 입장
  */

  if (
    person.alreadyCheckedIn === true
  ) {

    status.className =
      "checkin-status already-checked-in";


    status.innerHTML =

      "<strong>이미 입장했습니다.</strong>" +

      "<br>" +

      "입장시각: " +

      escapeHtml(
        person.checkInTime || ""
      );


    button.style.display =
      "none";

  }


  /*
     미입장
  */

  else {

    status.className =
      "checkin-status not-checked-in";


    status.innerHTML =
      "아직 입장 처리되지 않았습니다.";


    button.style.display =
      "block";


    button.disabled =
      false;


    button.textContent =
      "입장확인";

  }

}


/* =====================================================
   11. CHECK-IN
===================================================== */

function confirmCheckIn() {

  if (!currentQRCode) {

    return;

  }


  const button =
    document.getElementById(
      "checkInButton"
    );


  button.disabled =
    true;


  button.textContent =
    "입장 처리 중...";


  localCheckIn(currentQRCode, function(data) {


      if (
        !data ||
        data.success !== true
      ) {

        button.disabled =
          false;


        button.textContent =
          "입장확인";


        alert(

          data &&
          data.message

            ? data.message

            : "입장 처리 중 오류가 발생했습니다."

        );

        return;

      }


      if (
        data.found !== true
      ) {

        button.disabled =
          false;


        button.textContent =
          "입장확인";


        alert(
          "등록된 정보를 찾을 수 없습니다."
        );

        return;

      }


      const status =
        document.getElementById(
          "checkInStatus"
        );


      if (
        data.alreadyCheckedIn === true
      ) {

        status.className =
          "checkin-status already-checked-in";


        status.innerHTML =

          "<strong>이미 입장했습니다.</strong>" +

          "<br>" +

          "입장시각: " +

          escapeHtml(
            data.checkInTime || ""
          );

      }

      else {

        status.className =
          "checkin-status completed";


        status.innerHTML =

          "<strong>✓ 입장 완료</strong>" +

          "<br>" +

          "입장시각: " +

          escapeHtml(
            data.checkInTime || ""
          );

      }


      button.style.display =
        "none";

    }

  );

}


/* =====================================================
   12. JSONP API
===================================================== */

function callApi(
  action,
  params,
  callback
) {

  requestCounter++;


  const callbackName =

    "jsonpCallback_" +

    requestCounter +

    "_" +

    Date.now();


  const script =
    document.createElement(
      "script"
    );


  let timeout;


  window[callbackName] =
    function(data) {


      clearTimeout(
        timeout
      );


      if (
        script.parentNode
      ) {

        script.parentNode.removeChild(
          script
        );

      }


      delete window[
        callbackName
      ];


      callback(
        data
      );

    };


  let url =

    API_URL +

    "?action=" +

    encodeURIComponent(
      action
    );


  Object.keys(
    params || {}
  ).forEach(

    function(key) {


      url +=

        "&" +

        encodeURIComponent(
          key
        ) +

        "=" +

        encodeURIComponent(
          params[key]
        );

    }

  );


  url +=

    "&callback=" +

    encodeURIComponent(
      callbackName
    ) +

    "&t=" +

    Date.now();


  script.src =
    url;


  script.onerror =
    function() {


      clearTimeout(
        timeout
      );


      if (
        script.parentNode
      ) {

        script.parentNode.removeChild(
          script
        );

      }


      delete window[
        callbackName
      ];


      showError(
        "등록 데이터베이스에 연결할 수 없습니다."
      );

    };


  timeout =
    setTimeout(

      function() {


        if (
          script.parentNode
        ) {

          script.parentNode.removeChild(
            script
          );

        }


        delete window[
          callbackName
        ];


        showError(
          "서버 응답 시간이 초과되었습니다."
        );


      },

      15000

    );


  document.body.appendChild(
    script
  );

}


/* =====================================================
   13. NEXT PERSON
===================================================== */

function nextPerson() {

  currentQRCode =
    "";


  processing =
    false;


  document.getElementById(
    "personCard"
  ).style.display =
    "none";


  /*
     이름 검색으로 사람을 찾았다면
     다시 이름 검색 화면으로 이동
  */

  if (
    currentMode === "search"
  ) {

    openNameSearch();

    return;

  }


  /*
     QR 스캔으로 찾았다면
     바로 카메라 재시작
  */

  restartScanner();

}


/* =====================================================
   14. RESTART SCANNER
===================================================== */

function restartScanner() {

  currentMode =
    "scan";


  if (
    scannerRunning
  ) {

    return;

  }


  processing =
    false;


  currentQRCode =
    "";


  document.getElementById(
    "nameSearchArea"
  ).style.display =
    "none";


  document.getElementById(
    "personCard"
  ).style.display =
    "none";


  document.getElementById(
    "scannerSearchArea"
  ).style.display =
    "none";


  document.getElementById(
    "status"
  ).style.display =
    "block";


  document.getElementById(
    "status"
  ).innerHTML =
    "카메라를 다시 시작하고 있습니다...";


  if (
    selectedCameraId
  ) {

    startScanner()

      .catch(function(error) {


        document.getElementById(
          "status"
        ).innerHTML =

          '<div class="error">' +

          '카메라를 다시 시작할 수 없습니다.' +

          '<br><br>' +

          escapeHtml(
            String(error)
          ) +

          '</div>';

      });

  }

  else {

    document.getElementById(
      "cameraStartArea"
    ).style.display =
      "block";


    document.getElementById(
      "status"
    ).innerHTML =
      "QR 코드 스캔 또는 이름으로 찾기를 선택해 주세요.";

  }

}


/* =====================================================
   15. BACK TO QR SCANNER
===================================================== */

function backToScanner() {

  currentMode =
    "scan";


  currentQRCode =
    "";


  processing =
    false;


  document.getElementById(
    "nameSearchArea"
  ).style.display =
    "none";


  document.getElementById(
    "personCard"
  ).style.display =
    "none";


  document.getElementById(
    "status"
  ).style.display =
    "block";


  if (
    selectedCameraId
  ) {

    document.getElementById(
      "status"
    ).innerHTML =
      "카메라를 다시 시작하고 있습니다...";


    startScanner()

      .catch(function(error) {


        showError(

          "카메라를 다시 시작할 수 없습니다." +

          "<br><br>" +

          escapeHtml(
            String(error)
          )

        );

      });

  }

  else {

    document.getElementById(
      "cameraStartArea"
    ).style.display =
      "block";


    document.getElementById(
      "scannerSearchArea"
    ).style.display =
      "none";


    document.getElementById(
      "status"
    ).innerHTML =
      "QR 코드 스캔 또는 이름으로 찾기를 선택해 주세요.";

  }

}


/* =====================================================
   16. ERROR DISPLAY
===================================================== */

function showError(message) {

  document.getElementById(
    "personCard"
  ).style.display =
    "none";


  document.getElementById(
    "scannerSearchArea"
  ).style.display =
    "none";


  const status =
    document.getElementById(
      "status"
    );


  status.style.display =
    "block";


  status.innerHTML =

    '<div class="error">' +

    message +

    '</div>' +

    '<button onclick="restartScanner()">' +

    '다시 스캔' +

    '</button>';

}


/* =====================================================
   17. HTML ESCAPE
===================================================== */

function escapeHtml(value) {

  const div =
    document.createElement(
      "div"
    );


  div.textContent =

    String(

      value === undefined ||
      value === null

        ? ""

        : value

    );


  return div.innerHTML;

}


function toggleSettings() {
  const panel = document.getElementById('dataControls');
  const button = document.getElementById('settingsToggle');
  panel.hidden = !panel.hidden;
  button.setAttribute('aria-expanded', String(!panel.hidden));
}

/* Local registration cache and independent attendance status.
   Storage is per browser/profile. Back up TXT files and restore on another device. */
const REG_KEY = 'checkin_registrations_v1';
const STATUS_KEY = 'checkin_status_v1';
const SYNC_KEY = 'checkin_last_refresh_v1';
function readStore(key, fallback) {
  try { return JSON.parse(localStorage.getItem(key)) ?? fallback; }
  catch (_) { return fallback; }
}
function registrations() { return readStore(REG_KEY, []); }
function attendance() { return readStore(STATUS_KEY, {}); }
function refreshInfo() {
  const time = localStorage.getItem(SYNC_KEY);
  document.getElementById('dataInfo').textContent =
    `등록자 ${registrations().length}명 · 마지막 명단 갱신: ${time || '없음'} · 입장기록 ${Object.keys(attendance()).length}건`;
}
function combinedPerson(person) {
  const state = attendance()[String(person.code).trim()];
  return {...person, alreadyCheckedIn: !!state, checkInTime: state?.checkInTime || ''};
}
function localLookup(code, callback) {
  const p = registrations().find(p => String(p.code).trim() === String(code).trim());
  callback(p ? {success:true, found:true, ...combinedPerson(p)} : {success:true, found:false});
}
function localSearch(keyword, callback) {
  const results = registrations().filter(p => String(p.name || '').toLocaleLowerCase().includes(keyword.toLocaleLowerCase())).map(combinedPerson);
  callback({success:true, found:results.length>0, results});
}
function localCheckIn(code, callback) {
  const p = registrations().find(p => String(p.code).trim() === String(code).trim());
  if (!p) return callback({success:true, found:false});
  const state = attendance();
  if (state[code]) return callback({success:true,found:true,alreadyCheckedIn:true,checkInTime:state[code].checkInTime});
  const checkInTime = new Date().toLocaleString('en-AU', {dateStyle:'short',timeStyle:'medium'});
  state[code] = {checkedIn:true,checkInTime,updatedAt:new Date().toISOString()};
  try { localStorage.setItem(STATUS_KEY, JSON.stringify(state)); }
  catch (e) { return callback({success:false,message:'입장기록 저장 실패: '+e.message}); }
  refreshInfo();
  downloadText('checkin_status.txt', state);
  callback({success:true,found:true,alreadyCheckedIn:false,checkInTime});
}
function refreshRegistrations() {
  const password = prompt('명단 새로고침 관리자 비밀번호:');
  if (password === null) return;
  if (!password) return alert('비밀번호를 입력해 주세요.');
  // Authentication MUST occur on the server. Never store a password in HTML.
  callApi('refresh', {password}, function(data) {
    if (!data || data.success !== true || !Array.isArray(data.results)) {
      alert(data?.message || '명단 새로고침 실패'); return;
    }
    const list = data.results.map(p => ({
      code:String(p.code || '').trim(), name:String(p.name || ''),
      email:String(p.email || ''),phone:String(p.phone || ''),
      gender:String(p.gender || ''),age:String(p.age || '')
    })).filter(p => p.code);
    if (new Set(list.map(p=>p.code)).size !== list.length) return alert('중복된 등록 ID가 있어 갱신을 취소했습니다.');
    try {
      localStorage.setItem(REG_KEY, JSON.stringify(list));
      localStorage.setItem(SYNC_KEY, new Date().toLocaleString('en-AU'));
    } catch (e) { return alert('명단 저장 실패: '+e.message); }
    // STATUS_KEY is deliberately untouched.
    refreshInfo();
    downloadText('registrations.txt', {refreshedAt:localStorage.getItem(SYNC_KEY),results:list});
    alert(`${list.length}명의 명단을 새로고침했습니다. registrations.txt를 다운로드했습니다. 입장기록은 유지됐습니다.`);
  });
}
function downloadText(filename, data) {
  const blob = new Blob([JSON.stringify(data,null,2)], {type:'text/plain;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href=url; a.download=filename; a.click();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
}
function downloadBackups() {
  downloadText('registrations.txt',{refreshedAt:localStorage.getItem(SYNC_KEY),results:registrations()});
  downloadText('checkin_status.txt',attendance());
}
function restoreStatus(event) {
  const file=event.target.files?.[0]; if(!file) return;
  const reader=new FileReader();
  reader.onload=()=>{
    try {
      const data=JSON.parse(reader.result);
      if (!data || typeof data!=='object' || Array.isArray(data)) throw Error('Invalid format');
      if (!confirm('기존 입장기록을 복원 파일로 교체하시겠습니까?')) return;
      localStorage.setItem(STATUS_KEY,JSON.stringify(data)); refreshInfo(); alert('입장기록을 복원했습니다.');
    } catch(e) { alert('복원 실패: '+e.message); }
    finally { event.target.value=''; }
  };
  reader.readAsText(file);
}
refreshInfo();
