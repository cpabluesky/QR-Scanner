<!DOCTYPE html>
<html lang="ko">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>입장 확인</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      font-family: Arial, "Noto Sans KR", sans-serif;
      background: #f5f5f5;
      margin: 0;
      padding: 20px;
      text-align: center;
    }

    .container {
      max-width: 500px;
      margin: 0 auto;
    }

    h2 {
      margin-top: 10px;
      margin-bottom: 20px;
      color: #333;
    }

    #reader {
      width: 100%;
      background: white;
      border-radius: 12px;
      overflow: hidden;
    }

    #status {
      margin-top: 18px;
      padding: 16px;
      background: white;
      border-radius: 10px;
      font-size: 17px;
      line-height: 1.5;
    }

    #personCard {
      display: none;
      margin-top: 18px;
      padding: 22px;
      background: white;
      border-radius: 12px;
      text-align: left;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .name {
      font-size: 28px;
      font-weight: bold;
      margin-bottom: 18px;
      color: #333;
    }

    .row {
      padding: 10px 0;
      border-bottom: 1px solid #eee;
    }

    .label {
      font-size: 13px;
      color: #777;
      margin-bottom: 3px;
    }

    .value {
      font-size: 17px;
      color: #222;
    }

    .checkin-status {
      margin-top: 18px;
      padding: 15px;
      border-radius: 8px;
      text-align: center;
      line-height: 1.6;
    }

    .not-checked-in {
      background: #fff8e1;
    }

    .already-checked-in {
      background: #e8f5e9;
    }

    .completed {
      background: #e8f5e9;
      font-size: 18px;
    }

    .error {
      color: #b00020;
    }

    button {
      width: 100%;
      padding: 15px;
      margin-top: 16px;
      border: none;
      border-radius: 9px;
      font-size: 18px;
      cursor: pointer;
    }

    #checkInButton {
      background: #5b3b8c;
      color: white;
      font-weight: bold;
    }

    #scanAgainButton {
      background: #e0e0e0;
      color: #222;
    }

    button:disabled {
      opacity: 0.5;
      cursor: default;
    }

  </style>

</head>


<body>

<div class="container">

  <h2>QR 입장 확인</h2>

  <div id="reader"></div>

  <div id="status">
    카메라를 시작하고 있습니다...
  </div>


  <div id="personCard">

    <div id="personName"
         class="name">
    </div>


    <div class="row">

      <div class="label">
        이메일
      </div>

      <div id="personEmail"
           class="value">
      </div>

    </div>


    <div class="row">

      <div class="label">
        전화번호
      </div>

      <div id="personPhone"
           class="value">
      </div>

    </div>


    <div class="row">

      <div class="label">
        성별
      </div>

      <div id="personGender"
           class="value">
      </div>

    </div>


    <div class="row">

      <div class="label">
        연령대
      </div>

      <div id="personAge"
           class="value">
      </div>

    </div>


    <div id="checkInStatus">
    </div>


    <button id="checkInButton"
            onclick="confirmCheckIn()"
            style="display:none;">

      입장확인

    </button>


    <button id="scanAgainButton"
            onclick="restartScanner()">

      다음 사람 스캔

    </button>

  </div>

</div>


<script>

/* =====================================================
   APPS SCRIPT WEB APP URL
===================================================== */

const API_URL =
  "https://script.google.com/macros/s/AKfycbxB-dp9fBRQYF6O7HTwytJXQN5Q54wxdLer2mcMvPw3GlAQStrUCtWl6kXAOgnqtc9U/exec";


/* =====================================================
   VARIABLES
===================================================== */

let currentQRCode = "";

let scannerRunning = false;

let processing = false;

let requestCounter = 0;


const html5QrCode =
  new Html5Qrcode("reader");


/* =====================================================
   START QR SCANNER
===================================================== */

function startScanner() {

  processing = false;

  currentQRCode = "";


  document.getElementById("personCard")
    .style.display = "none";


  document.getElementById("status")
    .style.display = "block";


  document.getElementById("status")
    .innerHTML =
      "QR Code를 카메라에 보여주세요.";


  const config = {

    fps: 15,

    qrbox: function(
      viewfinderWidth,
      viewfinderHeight
    ) {

      const size =
        Math.floor(
          Math.min(
            viewfinderWidth,
            viewfinderHeight
          ) * 0.7
        );

      return {
        width: size,
        height: size
      };

    }

  };


  html5QrCode.start(

    {
      facingMode: "environment"
    },

    config,

    onScanSuccess,

    function() {
      // QR Code를 찾는 동안 발생하는
      // 반복적인 메시지는 무시합니다.
    }

  )

  .then(function() {

    scannerRunning = true;

  })

  .catch(function(error) {

    scannerRunning = false;

    showError(
      "카메라를 시작할 수 없습니다.<br><br>" +
      escapeHtml(String(error))
    );

  });

}


/* =====================================================
   QR SUCCESSFULLY SCANNED
===================================================== */

function onScanSuccess(decodedText) {

  if (processing) {
    return;
  }


  processing = true;


  currentQRCode =
    String(decodedText).trim();


  document.getElementById("status")
    .innerHTML =
      "QR Code 확인 중...";


  /*
     QR을 읽으면 카메라를 정지시킵니다.
  */

  html5QrCode.stop()

    .then(function() {

      scannerRunning = false;

      lookupPerson(
        currentQRCode
      );

    })

    .catch(function() {

      scannerRunning = false;

      lookupPerson(
        currentQRCode
      );

    });

}


/* =====================================================
   LOOKUP PERSON

   중요:
   여기서는 입장시각을 기록하지 않습니다.
===================================================== */

function lookupPerson(qrCode) {

  document.getElementById("status")
    .innerHTML =
      "등록정보를 확인하고 있습니다...";


  callApi(

    "lookup",

    qrCode,

    function(data) {

      if (
        !data ||
        data.success !== true
      ) {

        showError(
          data && data.message
            ? data.message
            : "등록정보를 확인할 수 없습니다."
        );

        return;

      }


      if (
        data.found !== true
      ) {

        showError(
          "등록된 정보를 찾을 수 없습니다.<br><br>" +
          "QR Code: " +
          escapeHtml(qrCode)
        );

        return;

      }


      displayPerson(data);

    }

  );

}


/* =====================================================
   DISPLAY PERSON
===================================================== */

function displayPerson(person) {

  document.getElementById("status")
    .style.display = "none";


  document.getElementById("personCard")
    .style.display = "block";


  document.getElementById("personName")
    .textContent =
      person.name || "";


  document.getElementById("personEmail")
    .textContent =
      person.email || "";


  document.getElementById("personPhone")
    .textContent =
      person.phone || "";


  document.getElementById("personGender")
    .textContent =
      person.gender || "";


  document.getElementById("personAge")
    .textContent =
      person.age || "";


  const checkInStatus =
    document.getElementById(
      "checkInStatus"
    );


  const checkInButton =
    document.getElementById(
      "checkInButton"
    );


  /*
     이미 입장한 경우
  */

  if (
    person.alreadyCheckedIn === true
  ) {

    checkInStatus.className =
      "checkin-status already-checked-in";


    checkInStatus.innerHTML =

      "<strong>이미 입장했습니다.</strong>" +

      "<br>" +

      "입장시각: " +

      escapeHtml(
        person.checkInTime || ""
      );


    /*
       이미 입장했으므로
       입장확인 버튼을 표시하지 않습니다.
    */

    checkInButton.style.display =
      "none";

  }


  /*
     아직 입장하지 않은 경우
  */

  else {

    checkInStatus.className =
      "checkin-status not-checked-in";


    checkInStatus.innerHTML =
      "아직 입장 처리되지 않았습니다.";


    /*
       이 경우에만 입장확인 버튼 표시
    */

    checkInButton.style.display =
      "block";


    checkInButton.disabled =
      false;


    checkInButton.textContent =
      "입장확인";

  }

}


/* =====================================================
   CHECK-IN BUTTON

   이 버튼을 눌렀을 때만
   Apps Script가 L열을 변경합니다.
===================================================== */

function confirmCheckIn() {

  if (!currentQRCode) {
    return;
  }


  const button =
    document.getElementById(
      "checkInButton"
    );


  /*
     중복 클릭 방지
  */

  button.disabled =
    true;


  button.textContent =
    "처리 중...";


  callApi(

    "checkin",

    currentQRCode,

    function(data) {

      if (
        !data ||
        data.success !== true
      ) {

        button.disabled =
          false;


        button.textContent =
          "입장확인";


        alert(
          data && data.message
            ? data.message
            : "입장 처리 중 오류가 발생했습니다."
        );


        return;

      }


      if (
        data.found !== true
      ) {

        button.disabled =
          false;


        button.textContent =
          "입장확인";


        alert(
          "등록된 정보를 찾을 수 없습니다."
        );


        return;

      }


      /*
         입장 성공
      */

      const status =
        document.getElementById(
          "checkInStatus"
        );


      status.className =
        "checkin-status completed";


      /*
         이미 다른 기기에서
         먼저 입장 처리됐을 수도 있습니다.
      */

      if (
        data.alreadyCheckedIn === true
      ) {

        status.innerHTML =

          "<strong>이미 입장했습니다.</strong>" +

          "<br>" +

          "입장시각: " +

          escapeHtml(
            data.checkInTime || ""
          );

      }

      else {

        status.innerHTML =

          "<strong>✓ 입장 완료</strong>" +

          "<br>" +

          "입장시각: " +

          escapeHtml(
            data.checkInTime || ""
          );

      }


      /*
         입장 완료 후 버튼 제거
      */

      button.style.display =
        "none";

    }

  );

}


/* =====================================================
   JSONP API CALL
===================================================== */

function callApi(
  action,
  qrCode,
  callback
) {

  requestCounter++;


  /*
     매 요청마다 다른 callback 이름을 사용합니다.
  */

  const callbackName =
    "jsonpCallback_" +
    requestCounter +
    "_" +
    Date.now();


  /*
     전역 callback 생성
  */

  window[callbackName] =
    function(data) {

      clearTimeout(timeout);


      if (script.parentNode) {
        script.parentNode.removeChild(script);
      }


      delete window[callbackName];


      callback(data);

    };


  /*
     JSONP Script 생성
  */

  const script =
    document.createElement("script");


  script.src =

    API_URL +

    "?action=" +
    encodeURIComponent(action) +

    "&code=" +
    encodeURIComponent(qrCode) +

    "&callback=" +
    encodeURIComponent(callbackName) +

    "&t=" +
    Date.now();


  /*
     네트워크 오류
  */

  script.onerror =
    function() {

      clearTimeout(timeout);


      if (script.parentNode) {
        script.parentNode.removeChild(script);
      }


      delete window[callbackName];


      showError(
        "등록 데이터베이스에 연결할 수 없습니다."
      );

    };


  /*
     10초 Timeout
  */

  const timeout =
    setTimeout(function() {

      if (script.parentNode) {
        script.parentNode.removeChild(script);
      }


      delete window[callbackName];


      showError(
        "서버 응답 시간이 초과되었습니다."
      );

    }, 10000);


  document.body.appendChild(
    script
  );

}


/* =====================================================
   SCAN NEXT PERSON
===================================================== */

function restartScanner() {

  if (scannerRunning) {
    return;
  }


  document.getElementById("personCard")
    .style.display = "none";


  document.getElementById("status")
    .style.display = "block";


  document.getElementById("status")
    .innerHTML =
      "카메라를 다시 시작하고 있습니다...";


  startScanner();

}


/* =====================================================
   ERROR DISPLAY
===================================================== */

function showError(message) {

  document.getElementById("personCard")
    .style.display = "none";


  const status =
    document.getElementById("status");


  status.style.display =
    "block";


  status.innerHTML =

    '<div class="error">' +
    message +
    '</div>' +

    '<button onclick="restartScanner()">' +
    '다시 스캔' +
    '</button>';

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(value) {

  const div =
    document.createElement("div");


  div.textContent =
    String(
      value === undefined ||
      value === null
        ? ""
        : value
    );


  return div.innerHTML;

}


/* =====================================================
   START APP
===================================================== */

startScanner();

</script>

</body>

</html>
