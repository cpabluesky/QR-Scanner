<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>QR Check-in</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 500px;
      margin: 0 auto;
      padding: 20px;
      text-align: center;
      background: #f5f5f5;
    }

    h2 {
      margin-bottom: 20px;
    }

    #reader {
      width: 100%;
      background: white;
      border-radius: 10px;
      overflow: hidden;
    }

    #result {
      margin-top: 20px;
      padding: 20px;
      background: white;
      border-radius: 10px;
      min-height: 70px;
    }

    .name {
      font-size: 26px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .success {
      font-size: 20px;
      line-height: 1.6;
    }

    .error {
      font-size: 20px;
      line-height: 1.5;
    }

    button {
      margin-top: 15px;
      padding: 12px 20px;
      font-size: 16px;
      cursor: pointer;
    }
  </style>
</head>


<body>

<h2>QR Check-in</h2>

<div id="reader"></div>

<div id="result">
  Point the camera at a QR code
</div>

<button id="scanAgain"
        onclick="restartScanner()"
        style="display:none;">
  Scan Again
</button>


<script>

/* =====================================================
   GOOGLE APPS SCRIPT URL
===================================================== */

const API_URL =
  "https://script.google.com/macros/s/AKfycbzGDh2wbmOH42S_i8XFZ5-Wg3pChVRbOaWxYB5cLmDAdf8etrcMXyAO-pllyRXAm8Ce/exec";


/* =====================================================
   QR SCANNER
===================================================== */

const html5QrCode =
  new Html5Qrcode(
    "reader",
    {
      formatsToSupport: [
        Html5QrcodeSupportedFormats.QR_CODE
      ]
    }
  );

let scanning = false;
let processing = false;


/* =====================================================
   START CAMERA
===================================================== */

function startScanner() {

  document.getElementById("result").innerHTML =
    "Point the camera at a QR code";

  document.getElementById("scanAgain").style.display =
    "none";

  processing = false;


  const config = {

    fps: 15,

    qrbox: function(viewfinderWidth, viewfinderHeight) {

      const size =
        Math.floor(
          Math.min(
            viewfinderWidth,
            viewfinderHeight
          ) * 0.7
        );

      return {
        width: size,
        height: size
      };
    }
  };


  html5QrCode.start(

    {
      facingMode: "environment"
    },

    config,

    onScanSuccess,

    function(errorMessage) {
      // Normal scan failures are ignored.
    }

  )

  .then(() => {

    scanning = true;

  })

  .catch(error => {

    document.getElementById("result").innerHTML =

      '<div class="error">' +

      'Camera error:<br>' +

      escapeHtml(String(error)) +

      '</div>';

  });
}


/* =====================================================
   QR DETECTED
===================================================== */

function onScanSuccess(decodedText) {

  if (processing) {
    return;
  }

  processing = true;


  document.getElementById("result").innerHTML =

    "QR detected: " +

    escapeHtml(decodedText) +

    "<br><br>Looking up registration...";


  html5QrCode.stop()

    .then(() => {

      scanning = false;

      lookupPerson(decodedText);

    })

    .catch(() => {

      scanning = false;

      lookupPerson(decodedText);

    });
}


/* =====================================================
   LOOK UP PERSON USING JSONP
===================================================== */

function lookupPerson(id) {

  /*
    Remove an old JSONP script if one exists.
  */

  const oldScript =
    document.getElementById("jsonpRequest");

  if (oldScript) {
    oldScript.remove();
  }


  /*
    Create a new script element.

    Example request:

    /exec?id=2&callback=handleResult
  */

  const script =
    document.createElement("script");

  script.id =
    "jsonpRequest";


  script.src =
    API_URL +
    "?id=" +
    encodeURIComponent(id) +
    "&callback=handleResult" +
    "&_=" +
    Date.now();


  /*
    If the Apps Script endpoint itself
    cannot be loaded.
  */

  script.onerror =
    function() {

      document.getElementById("result").innerHTML =

        '<div class="error">' +

        'Unable to contact registration database.' +

        '</div>';


      document.getElementById("scanAgain")
        .style.display =
        "inline-block";
    };


  document.body.appendChild(script);
}


/* =====================================================
   APPS SCRIPT CALLBACK

   Code.gs returns:

   handleResult({...});
===================================================== */

function handleResult(person) {

  const result =
    document.getElementById("result");


  if (
    person.success &&
    person.found
  ) {

    result.innerHTML =

      '<div class="name">' +

      escapeHtml(
        String(person.name)
      ) +

      '</div>' +

      '<div class="success">' +

      'ID: ' +

      escapeHtml(
        String(person.id)
      ) +

      '<br>' +

      'Status: ' +

      escapeHtml(
        String(person.status)
      ) +

      '</div>';

  }


  else if (
    person.success &&
    !person.found
  ) {

    result.innerHTML =

      '<div class="error">' +

      'ID not found' +

      '<br><br>' +

      'Scanned ID: ' +

      escapeHtml(
        String(person.id || "")
      ) +

      '</div>';

  }


  else {

    result.innerHTML =

      '<div class="error">' +

      'Database error' +

      '<br><br>' +

      escapeHtml(
        String(
          person.message ||
          "Unknown error"
        )
      ) +

      '</div>';
  }


  document.getElementById("scanAgain")
    .style.display =
    "inline-block";
}


/* =====================================================
   SCAN AGAIN
===================================================== */

function restartScanner() {

  if (scanning) {
    return;
  }

  startScanner();
}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(value) {

  const div =
    document.createElement("div");

  div.textContent =
    value;

  return div.innerHTML;
}


/* =====================================================
   START SCANNER
===================================================== */

startScanner();

</script>

</body>

</html>
