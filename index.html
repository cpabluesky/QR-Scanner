<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>QR Check-in</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 500px;
      margin: 0 auto;
      padding: 20px;
      text-align: center;
      background: #f5f5f5;
    }

    h2 {
      margin-bottom: 20px;
    }

    #reader {
      width: 100%;
      background: white;
      border-radius: 10px;
      overflow: hidden;
    }

    #result {
      margin-top: 20px;
      padding: 20px;
      background: white;
      border-radius: 10px;
      min-height: 70px;
      font-size: 18px;
      line-height: 1.5;
    }

    .name {
      font-size: 30px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .id {
      font-size: 18px;
    }

    .error {
      font-size: 18px;
    }

    button {
      margin-top: 15px;
      padding: 14px 25px;
      font-size: 18px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
  </style>
</head>


<body>

<h2>QR Check-in</h2>

<div id="reader"></div>

<div id="result">
  Starting camera...
</div>

<button id="scanAgain"
        onclick="restartScanner()"
        style="display:none;">
  Scan Again
</button>


<script>

/* =====================================================
   GOOGLE APPS SCRIPT
===================================================== */

const API_URL =
  "https://script.google.com/macros/s/AKfycbzGDh2wbmOH42S_i8XFZ5-Wg3pChVRbOaWxYB5cLmDAdf8etrcMXyAO-pllyRXAm8Ce/exec";


/* =====================================================
   VARIABLES
===================================================== */

const resultBox =
  document.getElementById("result");

const scanAgainButton =
  document.getElementById("scanAgain");

const html5QrCode =
  new Html5Qrcode("reader");

let processing = false;
let scannerRunning = false;
let jsonpTimer = null;


/* =====================================================
   START SCANNER
===================================================== */

function startScanner() {

  processing = false;

  scanAgainButton.style.display =
    "none";

  resultBox.innerHTML =
    "Starting camera...";


  const config = {

    fps: 15,

    qrbox: {
      width: 250,
      height: 250
    }

  };


  html5QrCode.start(

    {
      facingMode: "environment"
    },

    config,

    onScanSuccess,

    function(scanError) {
      // QR not detected yet.
      // Keep scanning.
    }

  )

  .then(function() {

    scannerRunning = true;

    resultBox.innerHTML =
      "Point the camera at a QR code";

  })

  .catch(function(error) {

    scannerRunning = false;

    resultBox.innerHTML =
      '<div class="error">' +
      'Camera error:<br><br>' +
      escapeHtml(String(error)) +
      '</div>';

  });

}


/* =====================================================
   QR DETECTED
===================================================== */

function onScanSuccess(decodedText) {

  if (processing) {
    return;
  }

  processing = true;


  resultBox.innerHTML =
    "QR detected: <strong>" +
    escapeHtml(decodedText) +
    "</strong><br><br>" +
    "Stopping camera...";


  html5QrCode.stop()

  .then(function() {

    scannerRunning = false;

    lookupPerson(decodedText);

  })

  .catch(function() {

    scannerRunning = false;

    lookupPerson(decodedText);

  });

}


/* =====================================================
   CONTACT APPS SCRIPT USING JSONP
===================================================== */

function lookupPerson(id) {

  resultBox.innerHTML =
    "QR detected: <strong>" +
    escapeHtml(id) +
    "</strong><br><br>" +
    "Contacting database...";


  /* Remove previous request */

  const oldScript =
    document.getElementById("jsonp-script");

  if (oldScript) {
    oldScript.remove();
  }


  /* Create JSONP request */

  const script =
    document.createElement("script");

  script.id =
    "jsonp-script";


  script.src =
    API_URL +
    "?id=" +
    encodeURIComponent(id) +
    "&callback=handleResult" +
    "&t=" +
    Date.now();


  /* Network/load failure */

  script.onerror =
    function() {

      clearTimeout(jsonpTimer);

      resultBox.innerHTML =
        '<div class="error">' +
        'Could not contact the database.' +
        '</div>';

      scanAgainButton.style.display =
        "inline-block";

    };


  /*
     Timeout gives us a visible error if
     Apps Script never calls handleResult().
  */

  jsonpTimer =
    setTimeout(function() {

      resultBox.innerHTML =
        '<div class="error">' +
        'Database request timed out.' +
        '</div>';

      scanAgainButton.style.display =
        "inline-block";

    }, 10000);


  document.body.appendChild(script);

}


/* =====================================================
   RESPONSE FROM APPS SCRIPT
===================================================== */

function handleResult(person) {

  clearTimeout(jsonpTimer);


  if (
    person.success === true &&
    person.found === true
  ) {

    resultBox.innerHTML =

      '<div class="name">' +
      escapeHtml(String(person.name)) +
      '</div>' +

      '<div class="id">' +
      'ID: ' +
      escapeHtml(String(person.id)) +
      '</div>';

  }


  else if (
    person.success === true &&
    person.found === false
  ) {

    resultBox.innerHTML =

      '<div class="error">' +

      'ID not found' +

      '<br><br>' +

      'Scanned ID: ' +
      escapeHtml(String(person.id || "")) +

      '</div>';

  }


  else {

    resultBox.innerHTML =

      '<div class="error">' +

      'Database error' +

      '<br><br>' +

      escapeHtml(
        String(
          person.message ||
          "Unknown error"
        )
      ) +

      '</div>';

  }


  scanAgainButton.style.display =
    "inline-block";

}


/* =====================================================
   SCAN AGAIN
===================================================== */

function restartScanner() {

  if (scannerRunning) {
    return;
  }

  startScanner();

}


/* =====================================================
   SAFE TEXT DISPLAY
===================================================== */

function escapeHtml(value) {

  const div =
    document.createElement("div");

  div.textContent =
    value;

  return div.innerHTML;

}


/* =====================================================
   START
===================================================== */

startScanner();

</script>

</body>

</html>
