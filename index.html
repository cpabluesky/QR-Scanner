<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>QR Check-in</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 500px;
      margin: 20px auto;
      padding: 15px;
      text-align: center;
    }

    #reader {
      width: 100%;
      margin-top: 20px;
    }

    #result {
      margin-top: 20px;
      padding: 15px;
      background: #f2f2f2;
      border-radius: 8px;
      font-size: 20px;
    }
  </style>
</head>

<body>

<h2>QR Check-in</h2>

<div id="reader"></div>

<div id="result">
  Point the camera at a QR code
</div>

<script>

const resultBox = document.getElementById("result");

const html5QrCode = new Html5Qrcode(
  "reader",
  {
    formatsToSupport: [
      Html5QrcodeSupportedFormats.QR_CODE
    ]
  }
);

function onScanSuccess(decodedText, decodedResult) {

  resultBox.innerHTML =
    "Scanned ID: <strong>" + decodedText + "</strong>";

  // Stop scanning after successful read
  html5QrCode.stop()
    .then(() => {
      console.log("Scanner stopped.");
    })
    .catch(err => {
      console.log(err);
    });
}

const config = {
  fps: 15,

  qrbox: function(viewfinderWidth, viewfinderHeight) {

    const size =
      Math.floor(Math.min(viewfinderWidth, viewfinderHeight) * 0.7);

    return {
      width: size,
      height: size
    };
  },

  aspectRatio: 1.0
};

html5QrCode.start(
  {
    facingMode: {
      exact: "environment"
    }
  },
  config,
  onScanSuccess,
  function(errorMessage) {
    // Ignore normal scan failures while looking for QR
  }
)
.catch(err => {

  resultBox.innerHTML =
    "Camera error: " + err;

});

</script>

</body>
</html>
